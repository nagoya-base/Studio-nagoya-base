<!DOCTYPE html>
<!--
  OpsPage.html — 自動生成（scripts/build-ops-gas-page.js）。手で編集しない。
  正本は _ops-app/frontend/（index.html / ops-client.js / tasks-client.js / home-client.js / revenue-client.js / records-client.js / gas-adapter.js）。Issue #936 / #941 / #990 / #995。
  予約は読み取り専用、メモは専用保存先のみ。google.script.run は gas-adapter.js のみ。応答はエスケープして描画する。

<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>SNB Operations</title>
  <style>
    :root { --bg:#f4f6fb; --fg:#14213d; --muted:#5b6478; --line:#d5dbe8; --card:#fff; --warn:#9a5b00; --err:#b3261e; --navy:#14284b; --blue:#1d5bd8; --blue-soft:#e8effd; --on-accent:#fff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1626; --fg:#e8ecf6; --muted:#9aa5bd; --line:#2a3550; --card:#18223a; --warn:#f2b24c; --err:#f2877f; --navy:#0b1220; --blue:#6f9cf5; --blue-soft:#1d2c52; --on-accent:#0b1220; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    header.top { background:var(--navy); color:#fff; padding:14px max(16px, calc((100% - 1040px) / 2)); }
    #res-filters, main { padding: 12px max(16px, calc((100% - 1040px) / 2)); }
    main { padding-bottom: 48px; }
    h1 { font-size: 1.15rem; margin: 0 0 2px; color:#fff; }
    header.top .note { color:#c9d3ea; margin:0; }
    .note { color: var(--muted); font-size: .85rem; margin: 0 0 8px; }
    .filters { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filters label { display:block; font-size:.8rem; color:var(--muted); min-width:0; }
    .filters select, .filters input, button { width:100%; min-height:44px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; min-width:0; }
    button { cursor:pointer; }
    button:hover { border-color:var(--blue); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--blue); outline-offset:1px; }
    button:disabled { opacity:.5; cursor:default; }
    #f-reload, #t-new, #t-submit { background:var(--blue); color:var(--on-accent); border-color:var(--blue); font-weight:700; }
    .row2 { grid-column: 1 / -1; display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    .banner { margin:10px 0; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); font-size:.9rem; overflow-wrap:anywhere; }
    .banner.err { border-color: var(--err); color: var(--err); }
    .banner .diag { margin-top:6px; color:var(--fg); font-size:.85rem; }
    .banner .diag code { font-weight:600; }
    .banner.stale { border-color: var(--warn); color: var(--warn); }
    .cards { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
    .card { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(20,40,75,.06); }
    button.card { position:relative; padding-right:36px; }
    button.card::after { content:"›"; position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:1.6rem; color:var(--blue); }
    button.card:hover, button.card:active { border-color:var(--blue); background:var(--blue-soft); }
    .card .more { color:var(--blue); font-size:.85rem; font-weight:600; margin-top:4px; }
    .tag.st-CONFIRMED { background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600; }
    .tag.st-PENDING { border-color:var(--warn); color:var(--warn); font-weight:600; }
    .tag.st-CANCELLED, .tag.st-EXPIRED, .tag.st-UNKNOWN { color:var(--muted); }
    .taskhead { display:block; width:100%; text-align:left; border:0; background:none; padding:0; min-height:44px; position:relative; padding-right:28px; }
    .taskhead::after { content:"▾"; position:absolute; right:4px; top:4px; color:var(--blue); }
    .taskhead[aria-expanded="true"]::after { content:"▴"; }
    .loading { color:var(--muted); }
    .banner.err::before { content:"⚠ "; }
    .card .top { display:flex; gap:8px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
    .card .when { font-weight:600; font-size:1.05rem; margin:4px 0; }
    .tag { display:inline-block; padding:0 8px; border:1px solid var(--line); border-radius:999px; font-size:.78rem; }
    dl { display:grid; grid-template-columns: 8.5em 1fr; gap:6px 10px; margin:0; }
    dt { color:var(--muted); font-size:.85rem; } dd { margin:0; overflow-wrap:anywhere; }
    .empty { color:var(--muted); font-style:italic; }
    details { margin-top:12px; } details li { overflow-wrap:anywhere; }
    [hidden] { display:none !important; }
    .banner.ok { border-color:#2e7d32; color:#2e7d32; }
    @media (prefers-color-scheme: dark) { .banner.ok { border-color:#81c995; color:#81c995; } }
    .card.slot { border-style:dashed; border-left:4px solid var(--warn); }
    .tag.slot { border-color:var(--warn); color:var(--warn); font-weight:700; }
    .tag.danger { border-color: var(--err); color: var(--err); font-weight:600; }
    h2 { font-size:1rem; margin:16px 0 8px; }
    .summary { margin:8px 0; display:flex; gap:8px; flex-wrap:wrap; }
    .memo { white-space:pre-wrap; margin:4px 0; }
    .task.overdue { border-color: var(--err); }
    .actions { display:grid; grid-template-columns: repeat(auto-fit, minmax(7em, 1fr)); gap:8px; margin-top:8px; }
    form.taskform { display:grid; gap:8px; margin:10px 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
    form.taskform label { display:block; font-size:.8rem; color:var(--muted); min-width:0; }
    form.taskform input, form.taskform select, form.taskform textarea { width:100%; min-height:44px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; min-width:0; }
    form.taskform textarea { min-height:6em; }
    .formbtns { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    @media (min-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }

    /* ナビ: スマホ幅は下部固定（セーフエリア対応）、PC幅は左の濃紺サイドバー。同じ要素を切り替える。 */
    #appnav { position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(3, 1fr); background:var(--navy); padding-bottom:env(safe-area-inset-bottom); border-top:1px solid #2a3a62; }

    #appnav button .ico { font-size:1.25rem; line-height:1; }
    #appnav button[aria-selected="true"] { color:#fff; background:rgba(255,255,255,.1); box-shadow:inset 0 3px 0 var(--blue); }
    #appnav button:focus-visible { outline-color:#fff; outline-offset:-3px; }
    /* ホーム */
    .hhead { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; flex-wrap:wrap; }
    .hhead h2 { font-size:1.35rem; margin:0; color:var(--navy); }
    @media (prefers-color-scheme: dark) { .hhead h2, .kpi .v { color:var(--fg); } }
    .hctl { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .hctl .full { grid-column:1 / -1; }
    .hctl label { font-size:.8rem; color:var(--muted); min-width:0; }
    .hctl select { width:100%; min-height:44px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
    .btn-primary, button.inline { width:auto; padding:6px 16px; }
    .btn-primary { background:var(--blue); color:var(--on-accent); border-color:var(--blue); font-weight:700; }
    button.inline { margin-top:6px; color:var(--blue); font-weight:600; }
    button.inline.btn-primary { background:var(--blue); color:var(--on-accent); border-color:var(--blue); }
    h2.sec { font-size:1rem; margin:18px 0 8px; color:var(--navy); }
    @media (prefers-color-scheme: dark) { h2.sec { color:var(--fg); } }
    .prio, .kpis, .uplist { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
    .prow, .uprow { display:flex; align-items:center; gap:12px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:0 1px 2px rgba(20,40,75,.06); }
    .prow:hover, .uprow:hover { background:var(--blue-soft); }
    .prow.overdue { border-color:var(--err); }
    .rank { flex:none; width:28px; height:28px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:700; font-size:.85rem; }
    .ptxt { flex:1; min-width:0; display:grid; overflow-wrap:anywhere; }
    .psub { color:var(--muted); font-size:.8rem; }
    .chev { flex:none; color:var(--blue); font-size:1.5rem; line-height:1; }
    .kpis { grid-template-columns:1fr 1fr; }
    .kpi { display:grid; gap:2px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:96px; box-shadow:0 1px 2px rgba(20,40,75,.06); }
    button.kpi:hover { background:var(--blue-soft); }
    .kpi.off { border-style:dashed; color:var(--muted); }
    .kpi .lbl { font-size:.8rem; color:var(--muted); }
    .kpi .v { font-size:1.9rem; font-weight:700; color:var(--navy); line-height:1.2; }
    .kpi .v small { font-size:.9rem; margin-left:2px; }
    .kpi .v.dim { font-size:1.15rem; color:var(--muted); }
    .kpi .sub { font-size:.75rem; color:var(--muted); }
    .kpi .sub.warn { color:var(--warn); }
    .chips { display:none; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .chip { width:auto; min-height:36px; padding:4px 14px; border-radius:999px; }
    .chip[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:var(--on-accent); font-weight:700; }
    .uphead { display:none; }
    .uprow { display:grid; grid-template-columns:1fr auto; gap:2px 8px; }
    .uprow .c-when { grid-column:1; }
    .uprow .c-svc, .uprow .c-ppl { grid-column:1; color:var(--muted); font-size:.85rem; }
    .uprow .c-st { grid-column:2; grid-row:1; }
    .uprow .chev { grid-column:2; grid-row:2 / span 2; justify-self:end; }
    .svcsel { display:block; }
    @media (min-width: 900px) {
      body { padding-bottom:0; padding-left:220px; }
      #appnav { top:0; bottom:0; right:auto; width:220px; display:flex; flex-direction:column; gap:4px; padding:20px 12px; border-top:0; }
      #appnav .brand { display:block; color:#fff; font-weight:700; font-size:1.1rem; padding:4px 10px 16px; }
      #appnav button { flex-direction:row; justify-content:flex-start; gap:10px; min-height:44px; border-radius:8px; font-size:.95rem; padding:6px 12px; }
      #appnav button[aria-selected="true"] { box-shadow:inset 3px 0 0 var(--blue); }
      .hctl { grid-template-columns:200px 120px; align-items:end; }
      .hctl .full { grid-column:auto; }
      .svcsel { display:none; }
      .kpis { grid-template-columns:repeat(4, 1fr); }
      .chips { display:flex; }
      .uphead, .uprow { display:grid; grid-template-columns:1.2fr 1fr .7fr 1fr 24px; align-items:center; gap:8px; }
      .uphead { color:var(--muted); font-size:.8rem; padding:0 12px; margin-bottom:4px; }
      .uprow .c-when, .uprow .c-svc, .uprow .c-ppl, .uprow .c-st, .uprow .chev { grid-column:auto; grid-row:auto; }
      .uprow .c-svc, .uprow .c-ppl { font-size:inherit; color:inherit; }
    }
    /* 売上（年商）KPI */
    .revhead { margin-top:18px; max-width:200px; }
    .revhead label { font-size:.8rem; color:var(--muted); display:block; }
    .revhead select { width:100%; min-height:44px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
    .rtabs { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 10px; }
    .rhero, .rmonth { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(20,40,75,.06); }
    .rlabel { font-size:.8rem; color:var(--muted); }
    .rnum { font-size:2rem; font-weight:700; color:var(--navy); line-height:1.25; overflow-wrap:anywhere; }
    .rnum.sm { font-size:1.5rem; }
    .rnum small { font-size:.9rem; font-weight:500; color:var(--muted); }
    @media (prefers-color-scheme: dark) { .rnum { color:var(--fg); } }
    .rbar { display:block; height:10px; border-radius:999px; background:var(--blue-soft); overflow:hidden; margin:6px 0; min-width:60px; }
    .rbar > span { display:block; height:100%; background:var(--blue); }
    .rsub { font-size:.85rem; margin-top:2px; }
    .dim { color:var(--muted); }
    h3.sub3 { font-size:.9rem; margin:14px 0 6px; color:var(--muted); }
    .rbreak { list-style:none; padding:0; margin:0; border:1px solid var(--line); border-radius:12px; background:var(--card); }
    .rbreak b { text-align:right; }
    .rbreak b:not(.dim) { white-space:nowrap; }
    .rbreak li { display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
    .rbreak li:last-child { border-bottom:0; }
    .mlist { list-style:none; padding:0; margin:0; display:grid; gap:4px; }
    .mrow { display:grid; grid-template-columns:3em 6.5em 1fr 4.5em; align-items:center; gap:8px; text-align:left; min-height:44px; padding:4px 10px; border-radius:8px; }
    .mrow.cur { border-color:var(--blue); background:var(--blue-soft); }
    .mrate { text-align:right; font-size:.8rem; color:var(--muted); }
    @media (min-width: 900px) { #revenue-view { display:block; } }
  </style>
</head>
<body>
  <nav id="appnav" aria-label="メインメニュー">

    <button type="button" id="tab-res" aria-selected="false"><span class="ico" aria-hidden="true">▦</span><span>予約</span></button>
    <button type="button" id="tab-tasks" aria-selected="false"><span class="ico" aria-hidden="true">✎</span><span>メモ</span></button>
  </nav>
  <header class="top">
    <h1>SNB Operations</h1>
    <p class="note">予約台帳の内容は閲覧のみです（予約の変更・決済・鍵の操作はできません）。メモは専用の保存先にだけ保存します。</p>
  </header>
  <div class="filters" id="res-filters" hidden>
    <label>サービス<select id="f-service"></select></label>

  <main>
    <section id="home-panel" aria-label="ホーム">
      <div class="hhead"><div><h2>今日、確認すること</h2><p class="note" id="home-today"></p></div><button type="button" id="home-add" class="btn-primary">＋ メモを追加</button></div>
      <div class="hctl">
        <label>表示する月（利用日・日本時間）<select id="home-month"></select></label>

        <label>予約ID（任意）<input type="text" id="t-booking" maxlength="64" autocomplete="off" inputmode="latin"></label>
        <label>短いメモ（500文字まで）<textarea id="t-memo" maxlength="500"></textarea></label>
        <label>証跡リンク（任意・https:// のみ）<input type="url" id="t-url" maxlength="300" autocomplete="off" inputmode="url"></label>

  </main>
  <script>
/*
 * ops-client.js — 運営アプリ段階1のフロントエンド画面ロジック（Issue #936）。
 *
 * - 通信方式に依存しない。バックエンドとは「共通接続契約」（docs/ops-reservations-936.md §6）を満たす
 *   アダプター { list(params, ok, ng), detail(id, ok, ng) } を介してのみ話す。google.script.run・HTTP・
 *   Sheets/SwitchBot への直接接続はここに持たない（アダプター側の責務）。
 * - 秘密情報を保持しない。権限・予約状態・元データの正しさを独自に確定しない（バックエンドの応答を描画するだけ）。
 * - 描画は文字列をすべてエスケープして行う。
 * - 遅れて返った古い応答は破棄（最新の要求のみ採用）。
 */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.OpsClient = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var SERVICES = [['all', 'すべて'], ['snb', 'SNB'], ['studio_x', 'Studio X'], ['snb_mens', 'SNB Mens'], ['snb_community', 'SNB Community（未接続）'], ['unclassified', '未分類']];
  var STATUSES = [['active', 'キャンセル除外'], ['all', 'すべて（キャンセル含む）'], ['PENDING', '仮予約'], ['CONFIRMED', '確定'], ['CANCELLED', 'キャンセル'], ['EXPIRED', '失効'], ['UNKNOWN', '不明']];
  var PHASE_LABELS = { upcoming: 'これから', in_progress: '利用中', ended: '終了済み', unknown: '開始済み（終了不明）' };
  var DENIED_CODES = ['UNAUTHENTICATED', 'FORBIDDEN'];
  /* 運営枠（#1003。読み取り専用）の表示切替。予約の絞り込みではなく画面側だけの切替（再取得しない）。 */
  var KINDS = [['all', '予約と運営枠'], ['res', '予約のみ'], ['slots', '運営枠のみ']];
  /* 運営枠を取得できない理由。どれも「運営枠0件」ではない（0件と書くのは取得成功のときだけ）。 */
  var SLOT_STATE_TEXT = {
    not_configured: '運営枠の読取先が未設定です。',
    no_access: '運営枠のカレンダーを開けません（見つからない、またはアクセス権がありません）。',
    auth_required: '運営枠の読み取り承認が済んでいません。所有者本人で専用URLを開き直し、カレンダーの閲覧の承認画面が出たら承認してください。',
    read_failed: '運営枠の取得に失敗しました。'
  };
  var IDLE_SLOTS = { phase: 'idle', data: null, error: null, fetchedAt: null };

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* null=未入力、0=0。空欄と0を混同しない。 */
  function show(value, suffix) {
    if (value === null || value === undefined || value === '') return '<span class="empty">未入力</span>';
    return esc(value) + (suffix || '');
  }

  /* 契約の日時はタイムゾーン付きISO。表示は日本時間（JST）に固定し、端末のタイムゾーンに依存しない。 */
  function jstText(iso, withDate) {
    if (typeof iso !== 'string') return null;
    var ms = Date.parse(iso);
    if (isNaN(ms)) return null;
    var d = new Date(ms + 9 * 3600 * 1000);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    var clock = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
    return withDate ? d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' + clock : clock;
  }

  /* 一覧の終了表示。JSTで開始と終了の日付が違う（日またぎ・複数日）場合は、終了日も併記して
     「22:00〜01:00」のような逆転した時間帯に見えないようにする。 */
  function endLabel(startAt, endAt) {
    var end = jstText(endAt, true);
    if (end === null) return null;
    var start = jstText(startAt, true);
    return start !== null && start.slice(0, 10) !== end.slice(0, 10) ? end + '（翌日以降）' : end.slice(11);
  }

  /* 手動再取得・連続操作で、遅れて返った古い応答が最新結果を上書きしないようにする。 */
  function createController(api, onChange) {
    var state = { phase: 'idle', data: null, lastSuccessAt: null, error: null, stale: false, detail: null, detailId: null, detailPhase: 'idle', detailError: null, key: { phase: 'idle', data: null, error: null, fetchedAt: null }, mock: api && api.kind === 'mock', slots: IDLE_SLOTS, kind: 'all' };
    var listSeq = 0, detailSeq = 0, keySeq = 0, slotSeq = 0;
    function emit() { if (onChange) onChange(state); }
    function fail(err) {
      state.error = err;
      if (DENIED_CODES.indexOf(err.code) !== -1) {
        /* 認可失敗では、以前の表示を残さない。 */
        state.phase = 'denied'; state.data = null; state.stale = false; state.detail = null; state.detailPhase = 'idle'; state.detailId = null; keySeq++; state.key = { phase: 'idle', data: null, error: null, fetchedAt: null };
        /* 実行中の他の要求（一覧・詳細）の遅れて返る成功応答が、消した表示を復活させないよう、保留中の要求を無効化する。 */
        listSeq++; detailSeq++; slotSeq++; state.slots = IDLE_SLOTS;
      } else {
        state.phase = err.code === 'NOT_CONNECTED' ? 'not_connected' : 'error';
        state.stale = !!state.data;
      }
    }
    /* 状態「キャンセル除外」（初期表示）はバックエンドの絞り込み値ではない。台帳は従来どおり全件取得し、
       キャンセル済みだけを画面側で外して、件数も表示結果に合わせる。履歴は消さず、状態「キャンセル」「すべて」で確認できる。 */
    function withoutCancelled(res) {
      var items = res.items.filter(function (i) { return i.status !== 'CANCELLED'; });
      return Object.assign({}, res, { items: items, counts: Object.assign({}, res.counts, { matched: items.length }), applied: Object.assign({}, res.applied, { status: 'active' }) });
    }
    /* 運営枠（#1003）は予約台帳とは別の要求。失敗しても予約一覧は壊さず、取得失敗として別に表示する（0件にしない）。 */
    function loadSlots() {
      var mine = ++slotSeq;
      if (!api.internalSlots) { state.slots = IDLE_SLOTS; return; }
      state.slots = { phase: 'loading', data: null, error: null, fetchedAt: null };
      api.internalSlots(function (res) {
        if (mine !== slotSeq) return;
        if (res && res.ok && res.internalSlots && typeof res.internalSlots.state === 'string') {
          state.slots = { phase: 'ready', data: res.internalSlots, error: null, fetchedAt: res.fetchedAt || null };
        } else if (res && res.error && DENIED_CODES.indexOf(res.error.code) !== -1) {
          fail(res.error);
        } else {
          state.slots = { phase: 'error', data: null, error: res && res.error ? res.error : { message: '運営枠の取得に失敗しました。' }, fetchedAt: null };
        }
        emit();
      }, function () {
        if (mine !== slotSeq) return;
        state.slots = { phase: 'error', data: null, error: { message: '運営枠の取得に失敗しました。' }, fetchedAt: null };
        emit();
      });
    }
    function setKind(kind) {
      state.kind = KINDS.some(function (k) { return k[0] === kind; }) ? kind : 'all';
      emit();
    }
    function load(params) {
      var mine = ++listSeq;
      var hideCancelled = params.status === 'active';
      if (hideCancelled) params = Object.assign({}, params, { status: 'all' });
      /* 詳細を開いたまま再取得した場合も、詳細を最新の台帳から取り直す。 */
      if (state.detailId !== null) openDetail(state.detailId);
      state.phase = 'loading';
      state.error = null;
      loadSlots();
      emit();
      api.list(params, function (res) {
        if (mine !== listSeq) return;
        if (res && res.ok) {
          state.data = hideCancelled ? withoutCancelled(res) : res; state.lastSuccessAt = res.fetchedAt; state.stale = false; state.error = null; state.phase = 'ready';
        } else {
          fail(res && res.error ? res.error : { code: 'FETCH_FAILED', message: '取得に失敗しました。' });
        }
        emit();
      }, function () {
        if (mine !== listSeq) return;
        fail({ code: 'FETCH_FAILED', message: '取得に失敗しました。', diagnostic: CLIENT_CALL_FAILED });
        emit();
      });
    }
    function openDetail(id) {
      var mine = ++detailSeq;
      state.detailId = id;
      state.detail = null; state.detailPhase = 'loading'; state.detailError = null;
      keySeq++; state.key = { phase: 'idle', data: null, error: null, fetchedAt: null };
      emit();
      api.detail(id, function (res) {
        if (mine !== detailSeq) return;
        if (res && res.ok) { state.detail = res.reservation; state.detailPhase = 'ready'; loadKey(id); }
        else {
          state.detailPhase = 'error'; state.detailError = res && res.error ? res.error : { message: '取得に失敗しました。' };
          if (res && res.error && DENIED_CODES.indexOf(res.error.code) !== -1) fail(res.error);
        }
        emit();
      }, function () {
        if (mine !== detailSeq) return;
        state.detailPhase = 'error'; state.detailError = { message: '取得に失敗しました。', diagnostic: CLIENT_CALL_FAILED };
        emit();
      });
    }
    /* 鍵・案内の状況（#942）は予約詳細とは別の要求。失敗しても詳細は壊さず、「未取得」と表示する（成功扱いにしない）。 */
    function loadKey(id) {
      var mine = ++keySeq;
      if (!api.keyStatus) { state.key = { phase: 'error', data: null, error: { message: 'この画面では鍵・案内の状況を取得できません。' }, fetchedAt: null }; return; }
      state.key = { phase: 'loading', data: null, error: null, fetchedAt: null };
      api.keyStatus(id, function (res) {
        if (mine !== keySeq) return;
        if (res && res.ok && res.keyStatus) state.key = { phase: 'ready', data: res.keyStatus, error: null, fetchedAt: res.fetchedAt || null };
        else state.key = { phase: 'error', data: null, error: res && res.error ? res.error : { message: '取得に失敗しました。' }, fetchedAt: null };
        emit();
      }, function () {
        if (mine !== keySeq) return;
        state.key = { phase: 'error', data: null, error: { message: '取得に失敗しました。', diagnostic: CLIENT_CALL_FAILED }, fetchedAt: null };
        emit();
      });
    }
    function closeDetail() { detailSeq++; keySeq++; state.detailId = null; state.detail = null; state.detailPhase = 'idle'; state.detailError = null; state.key = { phase: 'idle', data: null, error: null, fetchedAt: null }; emit(); }
    return { state: state, load: load, openDetail: openDetail, closeDetail: closeDetail, setKind: setKind };
  }

  /* 取得失敗の診断コード（#953）。サーバーが返す固定形式（STAGE/REASON[/HTTP]）だけを表示し、
     形式外の文字列は表示しない（生のエラー本文を画面へ出さない）。対応案はサーバー側の固定文。 */
  var DIAG_CODE_RE = /^(?:(?:META|HEADER|DATA|CLIENT)\/)?[A-Z][A-Z0-9_]{1,40}(?:\/\d{3})?$/;
  var CLIENT_CALL_FAILED = { code: 'CLIENT/CALL_FAILED', advice: '画面からバックエンドへの呼び出しに失敗しました（台帳の取得に入る前の失敗です）。専用URLを開き直し、Googleのログイン・承認画面が出たら完了してから再取得してください。続く場合はこの診断コードを開発担当へ共有してください。' };
  function renderDiag(err) {
    var d = err && err.diagnostic;
    if (!d || typeof d.code !== 'string' || !DIAG_CODE_RE.test(d.code)) return '';
    var advice = typeof d.advice === 'string' ? d.advice : '';
    return '<div class="diag">診断コード: <code>' + esc(d.code) + '</code>' + (advice ? '<br>' + esc(advice) : '') + '</div>';
  }

  function renderBanner(state) {
    var html = '';
    if (state.mock) html += '<div class="banner stale">モックデータ（架空）を表示しています。実際の予約ではありません。</div>';
    if (state.phase === 'loading') html += '<div class="banner loading" role="status">取得中…</div>';
    if (state.phase === 'denied') html += '<div class="banner err">' + esc(state.error.message) + '（予約情報は表示しません）</div>';
    if (state.phase === 'error' || state.phase === 'not_connected') {
      html += '<div class="banner err">' + esc(state.error.message) + renderDiag(state.error) + '</div>';
      if (state.stale) html += '<div class="banner stale">古いデータを表示しています（最終取得成功: ' + esc(jstText(state.lastSuccessAt, true) || state.lastSuccessAt) + ' JST）。最新ではありません。</div>';
    }
    if (state.phase === 'ready' && state.data) html += '<div class="banner">最終取得成功: ' + esc(jstText(state.lastSuccessAt, true) || state.lastSuccessAt) + ' JST</div>';
    return html;
  }

  function renderCard(item) {
    var phase = PHASE_LABELS[item.phase];
    return '<li><button type="button" class="card" data-id="' + esc(item.bookingId) + '">' +
      '<div class="top"><span class="tag">' + esc(item.serviceLabel) + '</span><span class="tag st-' + esc(item.status) + '">' + esc(item.statusLabel) + '</span>' + (phase ? '<span class="tag">' + esc(phase) + '</span>' : '') + '</div>' +
      '<div class="when">' + esc(item.date) + ' ' + show(jstText(item.startAt)) + '〜' + show(endLabel(item.startAt, item.endAt)) + '</div>' +
      '<div>' + show(item.name) + ' / ' + show(item.people, '名') + '</div>' +
      '<div class="note">' + esc(item.bookingId) + '</div><div class="more">タップで詳細・鍵の状況</div></button></li>';
  }

  function renderIssues(issues) {
    if (!issues || !issues.length) return '';
    var errors = issues.filter(function (i) { return i.severity === 'error'; }).length;
    var list = issues.map(function (i) {
      return '<li>' + esc(i.row) + '行目' + (i.bookingId ? '（' + esc(i.bookingId) + '）' : '') + ': ' + (i.severity === 'error' ? '【除外】' : '【注意】') + esc(i.reasons.join('、')) + '</li>';
    }).join('');
    return '<details><summary>確認が必要な行 ' + esc(issues.length) + '件（うち一覧から除外 ' + esc(errors) + '件）</summary><ul>' + list + '</ul></details>';
  }

  /* ---- 運営枠（#1003）。予約とは別の種類・別の件数で、詳細・鍵・現地払いへは進めない ---- */
  function slotCard(slot) {
    return '<li><div class="card slot" data-slot="1">' +
      '<div class="top"><span class="tag slot">運営枠</span><span class="tag">' + esc(slot.typeLabel) + '</span><span class="tag">' + esc(slot.placeLabel) + '</span>' + (slot.reminded ? '<span class="tag">リマインド済み</span>' : '') + '</div>' +
      '<div class="when">' + esc(slot.date) + ' ' + show(jstText(slot.startAt)) + '〜' + show(endLabel(slot.startAt, slot.endAt)) + '</div>' +
      '<div>' + show(slot.title) + '</div>' +
      '<div class="note">運営枠（閲覧専用）。予約の件数・売上には含みません。</div></div></li>';
  }

  /* 取得に成功した運営枠だけを、予約と同じ条件（期間・サービス・状態）で絞る。取得失敗は null（0件と区別する）。 */
  function visibleSlots(state) {
    var s = state.slots;
    if (!s || s.phase !== 'ready' || !s.data || s.data.state !== 'ready') return null;
    var a = state.data && state.data.applied;
    /* 運営枠に「確定・仮予約」などの状態は無い。個別の状態で絞っているときは運営枠を出さない（0件とも言わない）。 */
    if (a && a.status !== 'active' && a.status !== 'all') return { items: [], statusHidden: true };
    var items = (s.data.slots || []).filter(function (x) {
      if (!a) return true;
      return x.date >= a.from && x.date <= a.to && (a.service === 'all' || x.service === a.service);
    });
    return { items: items, statusHidden: false };
  }

  function renderSlotStatus(state) {
    var s = state.slots;
    if (!s || s.phase === 'idle') return '';
    if (s.phase === 'loading') return '<div class="banner loading" role="status">運営枠を取得中…</div>';
    if (s.phase === 'error') return '<div class="banner err" role="alert">' + esc(s.error && s.error.message || '運営枠の取得に失敗しました。') + '運営枠が0件という意味ではありません（予約の一覧には影響しません）。</div>';
    var d = s.data;
    if (d.state !== 'ready') {
      return '<div class="banner err" role="alert">' + esc(SLOT_STATE_TEXT[d.state] || SLOT_STATE_TEXT.read_failed) + '運営枠が0件という意味ではありません（予約の一覧には影響しません）。</div>';
    }
    var html = '';
    if (d.invalid > 0) html += '<div class="banner stale">種類・場所のタグを読めない運営枠が ' + esc(d.invalid) + ' 件あり、表示していません（タグの不一致）。</div>';
    var v = visibleSlots(state);
    if (v.statusHidden) return html + '<p class="note">状態で絞り込み中のため、運営枠は表示していません。</p>';
    html += '<p class="note">運営枠 ' + esc(v.items.length) + ' 件（閲覧専用・予約の件数と売上には含みません。登録・変更・取消は Booking Admin の運営枠パネルで行います）</p>';
    if (!v.items.length) html += '<div class="banner">条件に該当する運営枠は0件です（取得は正常に完了しています）。</div>';
    return html;
  }

  /* 予約カードと運営枠カードを開始時刻の順に並べる（同時刻は予約が先）。 */
  function mergedCards(state, showRes, showSlots) {
    var order = state.data && state.data.applied && state.data.applied.order === 'desc' ? -1 : 1;
    var rows = [];
    if (showRes && state.data) state.data.items.forEach(function (i, n) { rows.push({ ms: Date.parse(i.startAt) || 0, rank: 0, n: n, html: renderCard(i) }); });
    var v = showSlots ? visibleSlots(state) : null;
    if (v) v.items.forEach(function (x, n) { rows.push({ ms: Date.parse(x.startAt) || 0, rank: 1, n: n, html: slotCard(x) }); });
    rows.sort(function (x, y) { return (x.ms - y.ms) * order || (x.rank - y.rank) || (x.n - y.n); });
    return rows.map(function (r) { return r.html; }).join('');
  }

  function renderList(state) {
    var d = state.data;
    var kind = state.kind || 'all';
    var showRes = kind !== 'slots';
    var showSlots = kind !== 'res';
    if (!d) {
      /* 予約台帳を読めなくても、運営枠は別ソースとして表示する（予約の取得失敗は上のバナーに出ている）。 */
      if (!showSlots) return '';
      var only = mergedCards(state, false, true);
      return renderSlotStatus(state) + (only ? '<ul class="cards">' + only + '</ul>' : '');
    }
    var a = d.applied;
    var html = '<p class="note">条件: ' + esc(a.from) + '〜' + esc(a.to) + '（日本時間 0:00〜翌0:00の重なり） / ' + esc(a.order === 'asc' ? '開始が早い順' : '開始が遅い順') +
      ' / 該当 ' + esc(d.counts.matched) + '件（台帳 ' + esc(d.counts.sheetRows) + '行を全件取得）</p>';
    var notConnected = d.serviceStates.filter(function (s) { return s.state === 'not_connected'; });
    if (notConnected.length) html += '<p class="note">未接続: ' + notConnected.map(function (s) { return esc(s.label); }).join('、') + '（0件ではなく、まだ取り込んでいません）</p>';
    if (showSlots) html += renderSlotStatus(state);
    if (showRes && d.notConnectedSelected) {
      html += '<div class="banner stale">選択したサービスは未接続です。予約が0件という意味ではありません。</div>';
    } else {
      if (showRes && !d.items.length) html += '<div class="banner">条件に該当する予約は0件です（取得は正常に完了しています）。</div>';
      var cards = mergedCards(state, showRes, showSlots);
      if (cards) html += '<ul class="cards">' + cards + '</ul>';
    }
    return html + (showRes ? renderIssues(d.issues) : '');
  }

  function renderDetail(state) {
    if (state.detailPhase === 'idle') return '';
    var html = '<div class="banner"><button type="button" id="detail-close">‹ 一覧へ戻る</button></div>';
    if (state.detailPhase === 'loading') return html + '<div class="banner">取得中…</div>';
    if (state.detailPhase === 'error') return html + '<div class="banner err">' + esc(state.detailError.message) + renderDiag(state.detailError) + '</div>';
    var r = state.detail;
    var price = r.effectivePriceAmount === null ? '<span class="empty">未計算</span>' : esc(r.effectivePriceAmount) + '円' + (r.priceOverridden ? '（修正済み）' : '');
    var rows = [
      ['予約ID', show(r.bookingId)], ['サービス', show(r.serviceLabel) + (r.service === 'unclassified' ? '（元の値: ' + show(r.brandRaw) + '）' : '')],
      ['状態', show(r.statusLabel) + (r.status === null ? '（元の値: ' + show(r.statusRaw) + '）' : '')],
      ['利用の進行', show(PHASE_LABELS[r.phase] || null)],
      ['利用日', show(r.date)], ['開始', show(jstText(r.startAt, true))], ['終了', show(jstText(r.endAt, true))],
      ['氏名', show(r.name)], ['人数', show(r.people, '名')], ['利用者区分', show(r.customerType)], ['利用目的', show(r.purpose)],
      ['プラン', show(r.planCode)], ['大人数利用', r.largeParty ? 'はい' : 'いいえ'],
      ['支払方法', show(r.paymentMethod)], ['決済状態', show(r.paymentStatus)], ['利用料金', price],
      ['受付経路', show(r.source)], ['作成', show(jstText(r.createdAt, true))], ['更新', show(jstText(r.updatedAt, true))],
      ['確定', show(jstText(r.confirmedAt, true))], ['キャンセル', show(jstText(r.cancelledAt, true))], ['失効', show(jstText(r.expiredAt, true))]
    ];
    return html + '<dl>' + rows.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + x[1] + '</dd>'; }).join('') + '</dl>' + renderMailRecords(r) + renderKeyStatus(state) + renderOnsiteSlot(r) +
      '<p><button type="button" id="detail-to-tasks">メモ・期限を開く</button></p>';
  }

  /* 現地払い（カード決済でない）の予約にだけ、受領記録欄（#995。records-client.js が中身を描画）の差し込み先を置く。 */
  function renderOnsiteSlot(r) {
    return String(r.paymentMethod || '').trim() === 'オンラインクレジットカード' ? '' : '<div id="onsite-box"></div>';
  }

  /* 予約台帳のメール送信記録（#967。読み取り専用）。Bookingsの既存列を直接読んだ「送信記録」で、
     個別鍵の発行・暗証番号の別送・失効の状況ではない（それは下の鍵ブロックが別に示す）。
     「未送信」とは断定しない（空欄は「台帳上の記録なし」、列が無い場合は「確認不能」）。 */
  function mailRecordText(rec) {
    if (!rec || typeof rec !== 'object') return '<span class="empty">確認不能（台帳から読めません）</span>';
    if (rec.state === 'recorded') {
      var t = jstText(rec.at, true);
      return t === null ? '送信記録あり（日時を表示できません）' : '送信記録あり（' + esc(t) + ' JST）';
    }
    if (rec.state === 'none') return '<span class="empty">台帳上の記録なし</span>';
    if (rec.state === 'invalid') return '<span class="empty">日時不正・不明（台帳の値を日時として読めません）</span>';
    return '<span class="empty">確認不能（台帳に該当の項目がありません）</span>';
  }
  function renderMailRecords(r) {
    return '<h2>予約台帳のメール送信記録（読み取り専用）</h2><dl>' +
      '<dt>予約台帳／来場案内メール</dt><dd>' + mailRecordText(r.accessGuideMail) + '</dd>' +
      '<dt>予約台帳／確定メール</dt><dd>' + mailRecordText(r.confirmedMail) + '</dd></dl>' +
      '<p class="note">メールの送信記録です。個別鍵の登録・暗証番号の別送・解錠の成否を意味しません。</p>';
  }

  /* 鍵・案内の状況（#942。読み取り専用）。取得失敗・未接続・確認不能・不一致・要確認は別の表示。ジョブの稼働は別枠で、鍵の成功を意味しない。 */
  var TONE_CLASS = { ok: 'ok', info: '', warn: 'stale', ng: 'err' };
  function renderKeyStatus(state) {
    var k = state.key;

  <script>

 * - 二重送信: 保存中は再送しない。新規は端末が採番したID（新規フォームを開くたびに1つ）を失敗後の再送でも使い回し、

});

    html += '<div class="uphead" aria-hidden="true"><span>利用日</span><span>サービス</span><span>人数</span><span>状態</span></div><ul class="uplist">' + u.items.map(function (i) {
      var end = endText(i.startAt, i.endAt);
      return '<li><button type="button" class="uprow" data-home="res" data-id="' + esc(i.bookingId) + '">' +
        '<span class="c-when"><strong>' + esc(dayLabel(i.date)) + '</strong> ' + esc(clock(i.startAt) || '') + (end ? '〜' + esc(end) : '') + '</span>' +
        '<span class="c-svc">' + esc(i.serviceLabel) + '</span>' +
        '<span class="c-ppl">' + (i.people === null || i.people === undefined ? '人数未入力' : esc(i.people) + '名') + '</span>' +
        '<span class="c-st">' + statusTag(i) + '</span><span class="chev" aria-hidden="true">›</span></button></li>';
    }).join('') + '</ul>';
    html += '<p class="note">' + (u.total > u.items.length ? '表示月の ' + esc(u.total) + ' 件のうち、開始が早い ' + esc(u.items.length) + ' 件を表示。' : '') + '</p><button type="button" class="inline" data-home="card" data-target="res">予約の一覧を見る</button>';
    return html;
  }

  /*
   * 運営枠（#1003。閲覧専用）。「直近の予約・開催」の予約とは別枠で、予約の件数・概要カード・売上には含めない。
   * 取得失敗・未設定・権限なしは「0件」ではなく理由を表示する。0件と書くのは取得成功のときだけ。
   */
  var SLOT_STATE_TEXT = {
    not_configured: '運営枠の読取先が未設定です。',
    no_access: '運営枠のカレンダーを開けません（見つからない、またはアクセス権がありません）。',
    auth_required: '運営枠の読み取り承認が済んでいません（所有者本人で専用URLを開き直して承認してください）。',
    read_failed: '運営枠の取得に失敗しました。'
  };
  function renderInternalSlots(res, ctx) {
    var s = res && res.slots;
    if (!s || s.phase === 'idle') return '';
    var head = '<h2 class="sec">運営枠（閲覧専用）</h2>';
    if (s.phase === 'loading') return head + '<div class="banner loading" role="status">運営枠を取得中…</div>';
    var tail = '運営枠が0件という意味ではありません。';
    if (s.phase === 'error') return head + '<div class="banner err">' + esc(s.error && s.error.message || '運営枠の取得に失敗しました。') + tail + '</div>';
    if (s.data.state !== 'ready') return head + '<div class="banner err">' + esc(SLOT_STATE_TEXT[s.data.state] || SLOT_STATE_TEXT.read_failed) + tail + '</div>';
    var nowMs = typeof ctx.nowMs === 'number' ? ctx.nowMs : Date.now();
    var list = (s.data.slots || []).filter(function (x) {
      return x.date >= ctx.range.from && x.date <= ctx.range.to && (ctx.service === 'all' || x.service === ctx.service) && Date.parse(x.endAt) > nowMs;
    });
    var html = head;
    if (s.data.invalid > 0) html += '<div class="banner stale">種類・場所のタグを読めない運営枠が ' + esc(s.data.invalid) + ' 件あり、表示していません。</div>';
    if (!list.length) return html + '<div class="banner">表示月にこれからの運営枠はありません（取得は正常に完了しています）。</div>';
    html += '<ul class="cards">' + list.slice(0, 3).map(function (x) {
      var end = endText(x.startAt, x.endAt);
      return '<li><div class="card slot"><div class="top"><span class="tag slot">運営枠</span><span class="tag">' + esc(x.typeLabel) + '</span><span class="tag">' + esc(x.placeLabel) + '</span></div>' +
        '<div class="when">' + esc(dayLabel(x.date)) + ' ' + esc(clock(x.startAt) || '') + (end ? '〜' + esc(end) : '') + '</div><div>' + esc(x.title) + '</div></div></li>';
    }).join('') + '</ul>';
    return html + '<p class="note">表示月の運営枠 ' + esc(list.length) + ' 件' + (list.length > 3 ? '（開始が早い3件を表示）' : '') + '。予約の件数・概要カードには含みません。</p>';
  }

  /* 画面全体（#home-view の中身）。res / tasks は各コントローラーの state。ctx: { service, range }。 */
  function renderHome(res, tasks, ctx) {
    var rs = resStatus(res, { from: ctx.range.from, to: ctx.range.to, service: ctx.service });
    var ts = taskStatus(tasks);
    var html = '';
    html += renderPriority(ts, tasks);
    html += '<h2 class="sec">概要</h2><ul class="kpis">' + buildCards(rs, ts).map(renderCard).join('') + '</ul>';
    html += renderChips(ctx.service);
    html += renderUpcoming(rs, res);
    html += renderInternalSlots(res, ctx);
    return html;
  }

  function renderStamp(res, tasks, mock) {
    var parts = [];
    var r = res && res.lastSuccessAt ? stamp(res.lastSuccessAt) : null;
    var t = tasks && tasks.lastSuccessAt ? stamp(tasks.lastSuccessAt) : null;
    parts.push('予約 最終取得 ' + (r ? esc(r) + ' JST' : '—'));
    parts.push('メモ 最終取得 ' + (t ? esc(t) + ' JST' : '—'));
    return (mock ? '<div class="banner stale">モックデータ（架空）です。実際の予約・メモではありません。</div>' : '') + '<p class="note">' + parts.join(' ／ ') + '</p>';
  }

  function optionsHtml(list) {
    return list.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('');
  }

  /*
   * DOMへの結線（ブラウザーでのみ呼ぶ）。deps: { res: 予約コントローラー, tasks: メモコントローラー, revenue?: 売上コントローラー（再取得で一緒に更新）, now(): ms, mock }
   * 予約コントローラーは getFilters / setFilters / reload / openDetail、メモコントローラーは load / openTask を使う。
   */
  function mount(doc, deps) {
    function $(id) { return doc.getElementById(id); }
    var now = deps.now || function () { return Date.now(); };
    var res = deps.res, tasks = deps.tasks, revenue = deps.revenue || null;
    var model = { month: jstMonth(now()), service: 'all' };
    var selected = ['home', 'res', 'tasks'];

    $('home-month').innerHTML = optionsHtml(monthOptions(now()));
    $('home-service').innerHTML = optionsHtml(SERVICE_CHIPS);
    $('home-today').textContent = todayText(now());

    function wanted() {
      var r = monthRange(model.month);
      return { service: model.service, status: 'active', scope: 'custom', from: r.from, to: r.to };
    }
    function differs(a, b) { return ['service', 'status', 'scope', 'from', 'to'].some(function (k) { return a[k] !== b[k]; }); }
    /* ホームの条件（表示月・サービス・キャンセル除外）に予約一覧の絞り込みを合わせる。違うときだけ再取得する。 */
    function sync() {
      var w = wanted();
      if (differs(res.getFilters(), w)) { res.setFilters(w); res.reload(); }
    }
    function render() {
      $('home-month').value = model.month;
      $('home-service').value = model.service;
      $('home-stamp').innerHTML = renderStamp(res.state, tasks.state, !!res.state.mock);
      $('home-view').innerHTML = renderHome(res.state, tasks.state, { service: model.service, range: monthRange(model.month) });
    }
    function show(which) {
      var panelOf = { home: ['home-panel'], res: ['res-filters', 'res-panel'], tasks: ['tasks-panel'] };
      selected.forEach(function (k) {
        var on = k === which;
        $('tab-' + k).setAttribute('aria-selected', on ? 'true' : 'false');
        panelOf[k].forEach(function (id) { $(id).hidden = !on; });
      });
      if (which === 'home') { adoptService(); sync(); render(); }
    }
    /* 予約タブで選んだサービスがホームのチップにあれば引き継ぐ（無ければ「すべて」）。 */
    function adoptService() {
      var s = res.getFilters().service;
      model.service = SERVICE_CHIPS.some(function (o) { return o[0] === s; }) ? s : 'all';
    }
    function go(which) { $('tab-' + which).click(); }

    /* 予約タブ・メモタブ側の切替ではホームを隠す（それぞれの表示は既存のタブ処理が行う）。 */
    ['res', 'tasks'].forEach(function (k) {
      $('tab-' + k).addEventListener('click', function () { $('home-panel').hidden = true; $('tab-home').setAttribute('aria-selected', 'false'); });
    });
    $('tab-home').addEventListener('click', function () { show('home'); });

    $('home-month').addEventListener('change', function () { model.month = $('home-month').value; sync(); render(); });
    $('home-service').addEventListener('change', function () { model.service = $('home-service').value; sync(); render(); });
    $('home-reload').addEventListener('click', function () { res.reload(); tasks.load(); if (revenue) revenue.load(); });
    $('home-add').addEventListener('click', function () { go('tasks'); $('t-new').click(); });

    $('home-view').addEventListener('click', function (e) {
      var node = e.target;
      while (node && node !== $('home-view')) {
        var act = node.getAttribute && node.getAttribute('data-home');
        if (act) {
          var id = node.getAttribute('data-id');
          if (act === 'service') { model.service = node.getAttribute('data-service'); sync(); render(); }
          else if (act === 'retry-res') res.reload();
          else if (act === 'retry-tasks') tasks.load();
          else if (act === 'task') { go('tasks'); tasks.openTask(id); }
          else if (act === 'res') { go('res'); res.openDetail(id); }
          else if (act === 'card') {
            var target = node.getAttribute('data-target');
            if (target === 'res' || target === 'res-pending') res.closeDetail(); /* 開いたままの詳細が一覧の代わりに出ないようにする */
            if (target === 'res-pending') { var f = res.getFilters(); f.status = 'PENDING'; res.setFilters(f); res.reload(); go('res'); }
            else go(target);
          }
          return;
        }
        node = node.parentNode;
      }
    });

    /* 起動時のホームは既に表示中。取得済みの応答は各コントローラーの変更通知で描画する。 */
    tasks.load();
    render();
    /* 売上の月別行から、その月の予約一覧（キャンセル除外・全サービス）へ移る。ホームに戻ると条件はホームの月へ戻る。 */
    function drill(ym) {
      var r = monthRange(ym);
      if (!r) return;
      res.closeDetail();
      res.setFilters({ service: 'all', status: 'active', scope: 'custom', from: r.from, to: r.to });
      res.reload();
      go('res');
    }
    return { render: render, model: model, show: show, sync: sync, drill: drill };
  }

  return { esc: esc, jstMonth: jstMonth, monthRange: monthRange, addMonths: addMonths, monthOptions: monthOptions, todayText: todayText,
    selectPriority: selectPriority, selectUpcoming: selectUpcoming, resStatus: resStatus, taskStatus: taskStatus, buildCards: buildCards,
    renderHome: renderHome, renderInternalSlots: renderInternalSlots, renderCard: renderCard, renderStamp: renderStamp, mount: mount, SERVICE_CHIPS: SERVICE_CHIPS };
});

</script>
  <script>
/*
 * revenue-client.js — 年商（売上）目標の達成状況と月次KPI（Issue #990 PR-B）。
 *
 * - 集計はバックエンド（OpsRevenue.gs）が行う。ここは応答を描画するだけで、金額を計算し直したり推計したりしない
 *   （達成率の表示用の割り算と、表示上の丸めのみ）。
 * - 80万円・130万円は年商（売上）目標。利益ではない。経費・利益・SNBCイベント収益は未接続なら「未接続」と表示し、0円にしない。
 * - 実績（利用が過ぎ、かつ支払い済み）／予定／利用済み・入金未確認／返金は別項目。予定は達成率に入れない。
 * - 取得失敗・権限なし・一部ソース未接続・台帳の読めない行は、実績が不完全であることを明示する。
 * - 描画は文字列をすべてエスケープする。個人名・予約IDは扱わない。
 */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.OpsRevenueClient = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var DENIED_CODES = ['UNAUTHENTICATED', 'FORBIDDEN'];
  var SERVICE_LABELS = { snb: 'SNB', snb_mens: 'SNB Mens', studio_x: 'Studio X', unclassified: '未分類（ブランド不明）' };

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function yen(n) { return '¥' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  /* 達成率は切り捨て（100%未満を100%と見せない）。 */
  function pct(rate) { return (Math.floor(rate * 1000) / 10).toFixed(1) + '%'; }
  function bar(rate) { return '<span class="rbar" aria-hidden="true"><span style="width:' + Math.min(100, Math.max(0, Math.floor(rate * 100))) + '%"></span></span>'; }

  function createController(api, onChange, options) {
    var opts = options || {};
    var state = { phase: 'idle', data: null, error: null, year: opts.year || null, goal: 'base', mock: !!(api && api.kind === 'mock') };
    var seq = 0;
    function emit() { if (onChange) onChange(state); }
    function load() {
      var mine = ++seq;
      state.phase = state.data ? 'refreshing' : 'loading'; state.error = null; emit();
      var params = state.year ? { year: state.year } : {};
      if (!api || typeof api.revenue !== 'function') { state.phase = 'error'; state.error = { message: 'この画面では売上を取得できません。' }; emit(); return; }
      api.revenue(params, function (res) {
        if (mine !== seq) return;
        if (res && res.ok) { state.data = res; state.phase = 'ready'; if (!state.year) state.year = res.revenue.year; }
        else if (res && res.error && DENIED_CODES.indexOf(res.error.code) !== -1) { state.data = null; state.phase = 'denied'; state.error = res.error; }
        else { state.phase = 'error'; state.error = res && res.error ? res.error : { message: '売上の取得に失敗しました。' }; }
        emit();
      }, function () {
        if (mine !== seq) return;
        state.phase = 'error'; state.error = { message: '売上の取得に失敗しました（通信エラー）。' }; emit();
      });
    }
    function setYear(y) { state.year = Number(y); state.data = null; load(); }
    function setGoal(id) { state.goal = id === 'upper' ? 'upper' : 'base'; emit(); }
    return { state: state, load: load, setYear: setYear, setGoal: setGoal };
  }

  function sourceNote(name, src) {
    if (!src || src.state === 'ready') return null;
    return src.state === 'error' ? name + 'の取得に失敗しました（金額に含めていません）' : name + 'は未接続です（金額に含めていません）';
  }

  var PARTIAL_TEXT = {
    SNBC_NOT_CONNECTED: 'SNBCイベント収益が未接続（保存先が未設定）',
    SNBC_UNAVAILABLE: 'SNBCイベント記録を取得できていない（金額に含めていません）',
    SNBC_NO_RECORDS: 'SNBC未入力・要確認（この年のSNBC記録がありません。0円とは限りません）',
    SNBC_RECORDED_ONLY: 'SNBCは記録済みのイベントだけの合計（未入力の旧イベントが残っている可能性があります）',
    SNBC_ROWS_SKIPPED: 'SNBC記録に読み込めない行がある',
    SNBC_FUTURE_ROWS: 'SNBC記録に未来の開催日の行がある（金額に含めていません）',
    ONSITE_RECORDS_UNAVAILABLE: '現地払いの受領記録を取得できていない（金額に含めていません）',
    ONSITE_ROWS_SKIPPED: '現地払いの受領記録に読み込めない行がある',
    ONSITE_RECEIPT_DUPLICATE: '台帳に受領記録がある（またはカード決済の）予約に、手入力の受領記録も重複している（台帳を優先し、手入力は加算していません）',
    ONSITE_RECEIPT_UNMATCHED: '台帳の予約と一意に突合できない手入力の受領記録がある（金額に含めていません）',
    ONSITE_PAYMENT_UNCONFIRMED: '現地払い（現金・PayPay）の受領記録が台帳にない予約がある',
    REFUND_UNSETTLED: '返金処理中または返金方法が不明な取消がある',
    CANCEL_MONTH_UNKNOWN: '取消確定日時が不明で、キャンセル料の計上月を判断できない取消がある（利用予定月へは振り替えず除外）',
    RECEIPT_UNRESOLVED: '受領済みの可能性があるが、精算の記録が当初のカード入金に満たず集計できない予約がある（二重算入を避けるため除外）',
    SETTLEMENT_PENDING: '日程・人数変更の精算（追加請求・返金）が未了で、受領額の差額が確定していない予約がある',
    AMOUNT_UNKNOWN: '金額が読めない確定予約がある',
    MEMBERS_UNAVAILABLE: '会員費を取得できていない',
    OPTIONS_UNAVAILABLE: '有料オプションを取得できていない',
    OPTION_ON_INACTIVE_BOOKING: '取消・失効・仮予約に紐づく支払い済みオプションがある（返金判断が必要。実績に入れていません）',
    OPTION_UNMATCHED: '紐づく予約のない支払い済みオプションがある'
  };
  function partialText(reasons) {
    var list = (reasons || []).map(function (c) { return PARTIAL_TEXT[c]; }).filter(Boolean);
    return list.length ? '未接続ソースあり・未確定の項目あり: ' + list.map(esc).join(' ／ ') + '。' : '';
  }

  function renderMonths(rev, goalAmount, year) {
    var base = goalAmount / 12;
    var rows = rev.months.map(function (m) {
      var future = rev.currentMonth !== null && m.month > rev.currentMonth;
      var ym = year + '-' + (m.month < 10 ? '0' : '') + m.month;
      var rate = base > 0 ? m.actual / base : 0;
      return '<li><button type="button" class="mrow' + (rev.currentMonth === m.month ? ' cur' : '') + '" data-rev="month" data-month="' + esc(ym) + '">' +
        '<span class="mname">' + m.month + '月</span>' +
        '<span class="mval">' + (future && m.actual === 0 ? '<span class="dim">—</span>' : esc(yen(m.actual))) + '</span>' +
        bar(rate) + '<span class="mrate">' + (future && m.actual === 0 ? '' : esc(pct(rate))) + '</span></button></li>';
    }).join('');
    return '<ul class="mlist">' + rows + '</ul><p class="note">月の行を押すと、その月の予約一覧（利用日ベース）を開きます。売上の計上月は、キャンセル料が取消確定月、会員費が入金月のため、一覧の件数・金額とは一致しない場合があります。</p>';
  }

  function renderRevenue(state) {
    var head = '<h2 class="sec">年商の達成状況（売上・暦年）</h2>';
    var mock = state.mock ? '<div class="banner stale">モックデータ（架空）です。実際の売上ではありません。</div>' : '';
    if (state.phase === 'idle' || (state.phase === 'loading' && !state.data)) return head + mock + '<div class="banner loading" role="status">売上を取得中…</div>';
    if (state.phase === 'denied') return head + '<div class="banner err">売上を表示する権限がありません。</div>';
    if (state.phase === 'error' && !state.data) return head + mock + '<div class="banner err">' + esc(state.error && state.error.message || '売上の取得に失敗しました。') + '（0円という意味ではありません）<br><button type="button" class="inline" data-rev="retry">売上を再取得</button></div>';
    var d = state.data, rev = d.revenue;
    var goal = rev.goals.filter(function (g) { return g.id === state.goal; })[0] || rev.goals[0];
    var t = rev.totals;
    var html = head + mock;
    if (state.phase === 'error') html += '<div class="banner stale">最新の取得に失敗しました。古い内容を表示しています。</div>';
    var incomplete = [];
    var n1 = sourceNote('会員費', rev.sources.members), n2 = sourceNote('有料オプション', rev.sources.options);
    if (n1) incomplete.push(n1); if (n2) incomplete.push(n2);
    if (d.excludedRows > 0) incomplete.push('台帳の ' + d.excludedRows + ' 件が読み込めず一覧から除外されています');
    if (rev.notes && rev.notes.optionUnmatchedCount > 0) incomplete.push('紐づく予約が見つからない支払い済みオプションが ' + rev.notes.optionUnmatchedCount + ' 件あります（金額に含めていません）');
    if (rev.notes && rev.notes.optionInactiveCount > 0) incomplete.push('取消・失効・仮予約に紐づく支払い済みオプションが ' + rev.notes.optionInactiveCount + ' 件あります（返金判断が必要。金額に含めていません）');
    if (t.unknownAmountCount > 0) incomplete.push('金額が読めない確定予約が ' + t.unknownAmountCount + ' 件あります（金額に含めていません）');
    if (incomplete.length) html += '<div class="banner stale" role="alert"><strong>実績は不完全です：</strong>' + incomplete.map(esc).join(' ／ ') + '</div>';

    html += '<div class="rtabs" role="group" aria-label="目標の切替">' + rev.goals.map(function (g) {
      return '<button type="button" class="chip" data-rev="goal" data-goal="' + esc(g.id) + '" aria-pressed="' + (g.id === goal.id ? 'true' : 'false') + '">' + esc(g.label) + ' ' + esc(yen(g.amount)) + '</button>';
    }).join('') + '</div>';
    var part = rev.partial || { isPartial: false, reasons: [] };
    if (part.isPartial) html += '<div class="banner stale" role="note"><strong>この金額は「接続済み・確認済み額の部分計」です。全体の年商ではありません。</strong>' + partialText(part.reasons) + '</div>';
    html += '<div class="rhero"><div class="rlabel">' + esc(rev.year) + '年の実績売上（確認済み額の部分計・年累計）</div><div class="rnum">' + esc(yen(t.actual)) + '<small> / ' + esc(yen(goal.amount)) + '</small></div>' +
      bar(goal.rate) + '<div class="rsub"><strong>達成率 ' + esc(pct(goal.rate)) + '</strong>' + (part.isPartial ? '（部分計に対する達成率。確定達成率とは扱いません）' : '') + ' ・ 残額 ' + esc(yen(goal.remaining)) + '</div>';

      '<li><span>カード決済で利用済み・未入金</span><b>' + esc(yen(t.unconfirmed)) + '</b></li>' +

      '<li><span>受領済みの可能性があるが集計不可（精算の記録が当初のカード入金に満たない）</span><b>' + esc(t.receiptUnresolvedCount || 0) + '件</b></li>' +

      '<li><span>経費・利益</span><b class="dim">未接続（売上達成率から差し引きません）</b></li></ul>';
    html += '<h3 class="sub3">月別の実績</h3>' + renderMonths(rev, goal.amount, rev.year);
    html += '<p class="note">計上基準: ' + esc(rev.basis) + ' 最終取得 ' + esc((d.fetchedAt || '').slice(0, 16).replace('T', ' ')) + '</p>';
    return html;
  }

  /* DOMへの結線。opts.onDrill({ month: 'YYYY-MM' }) で月の予約一覧へ移る。 */
  function mount(doc, api, options) {
    var opts = options || {};
    function $(id) { return doc.getElementById(id); }
    var now = opts.now ? opts.now() : Date.now();
    var curYear = new Date(now + 9 * 3600 * 1000).getUTCFullYear();
    $('rev-year').innerHTML = [curYear - 1, curYear].map(function (y) { return '<option value="' + y + '">' + y + '年</option>'; }).join('');
    var ctl = createController(api, function (state) {
      if (state.year) $('rev-year').value = String(state.year);
      $('revenue-view').innerHTML = renderRevenue(state);
      if (opts.onChange) opts.onChange(state);
    }, { year: curYear });
    $('rev-year').addEventListener('change', function () { ctl.setYear($('rev-year').value); });
    $('revenue-view').addEventListener('click', function (e) {
      var node = e.target;

        var act = node.getAttribute && node.getAttribute('data-rev');

        if (act === 'retry') { ctl.load(); return; }
        if (act === 'snbc') { if (opts.onSnbc) opts.onSnbc(); return; }
        if (act === 'month') { if (opts.onDrill) opts.onDrill({ month: node.getAttribute('data-month') }); return; }
        node = node.parentNode;
      }
    });
    ctl.load();
    return ctl;
  }

  return { esc: esc, yen: yen, pct: pct, createController: createController, renderRevenue: renderRevenue, mount: mount };
});

</script>
  <script>
/*
 * records-client.js — SNBC売上の記録／現地払いの受領記録の画面ロジック（Issue #995 PR-C）。
 *
 * - 通信方式に依存しない。バックエンドとは gas-adapter.js の createGasRecordsApi と同じ形のアダプター
 *   { snbcList, snbcSave, snbcDelete, onsiteGet, onsiteSave, onsiteDelete }（それぞれ (引数, ok, ng)）だけで話す。保存先ID・タブ名は扱わない。
 * - 入力検証・版・競合・二重計上の判断はサーバーが正本。ここは入力の整形と応答の描画だけ（年商の金額は計算しない）。
 * - 保存の成否は、サーバーが ok:true を返したときだけ成功と表示する。通信失敗は「保存できたか確認できていない」とし、成功にしない。入力は消さない。
 * - 二重送信: 保存中は再送しない。新規のイベントIDは入力フォームを開くたびに1つ採番し、失敗後の再送でも使い回す（サーバー側は上書きで冪等）。
 * - 氏名・電話・メール・DM本文は入力欄を設けない。描画は文字列をすべてエスケープする。
 */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.OpsRecordsClient = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var DENIED_CODES = ['UNAUTHENTICATED', 'FORBIDDEN'];
  var CARD_METHOD = 'オンラインクレジットカード';
  var METHOD_OPTIONS = [['cash', '現金'], ['paypay', 'PayPay'], ['other', 'その他・混在']];
  var UNCONFIRMED = '保存できたか確認できていません。再読み込みして内容を確認してください（入力は残しています）。';

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function yen(n) { return '¥' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function withHint(err) {
    var m = (err && err.message) || '';
    if (err && typeof err.hint === 'string' && err.hint) m += ' ' + err.hint;
    if (err && typeof err.reason === 'string' && /^[A-Z0-9_\/]{1,48}$/.test(err.reason)) m += '（診断コード: ' + err.reason + '）';
    return m;
  }
  function newId(prefix) {
    var chars = '0123456789abcdefghijklmnopqrstuvwxyz', s = '';
    for (var i = 0; i < 12; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return prefix + '-' + s;
  }
  /* 入力欄の文字列 → 整数円。空欄は ''（任意項目）。整数でなければ NaN。全角数字・カンマは受け付けない（誤入力を防ぐ）。 */
  function toInt(text) {
    var t = String(text === undefined || text === null ? '' : text).trim();
    if (t === '') return '';
    return /^\d{1,9}$/.test(t) ? Number(t) : NaN;
  }
  function field(label, html) { return '<label>' + esc(label) + html + '</label>'; }

  /* ===================== SNBC売上 ===================== */
  function emptySnbcForm() { return { eventId: newId('E'), eventDate: '', title: '', receivedJpy: '', refundedJpy: '0', paidCount: '', directCostJpy: '' }; }

  function createSnbcController(api, onChange, options) {
    var opts = options || {};
    var state = { phase: 'idle', items: [], storeReady: true, skipped: 0, today: null, error: null, open: false, form: emptySnbcForm(), editing: null, saving: false, message: null, formError: null, confirmDelete: false };
    var seq = 0;
    var formGen = 0; /* フォームの世代。保存・削除の完了時に、送信したフォームがまだ現在のものか判定する。 */
    function emit() { if (onChange) onChange(state); }
    function load() {
      var mine = ++seq;
      state.phase = state.items.length ? 'refreshing' : 'loading'; state.error = null; emit();
      api.snbcList(function (res) {
        if (mine !== seq) return;
        if (res && res.ok) { state.items = res.items || []; state.storeReady = res.storeReady !== false; state.skipped = res.skippedRows || 0; state.today = res.todayJst || null; state.phase = 'ready'; }
        else if (res && res.error && DENIED_CODES.indexOf(res.error.code) !== -1) { state.phase = 'denied'; state.error = res.error; }
        else { state.phase = 'error'; state.error = res && res.error ? res.error : { message: 'SNBC記録の取得に失敗しました。' }; }
        emit();
      }, function () {
        if (mine !== seq) return;
        state.phase = 'error'; state.error = { message: 'SNBC記録の取得に失敗しました（通信エラー）。' }; emit();
      });
    }
    function resetForm() { formGen++; state.form = emptySnbcForm(); state.editing = null; state.confirmDelete = false; state.formError = null; }
    function setOpen(on) {
      state.open = !!on; state.message = null;

    }
    function toggle() { setOpen(!state.open); }
    function setField(k, v) { if (Object.prototype.hasOwnProperty.call(state.form, k)) state.form[k] = v; }
    function edit(id) {
      if (state.saving) return; /* 保存・削除の進行中は編集対象を切り替えない（完了通知が別イベントの入力を消さないように） */
      var it = state.items.filter(function (x) { return x.eventId === id; })[0];
      if (!it) return;
      formGen++;
      state.editing = { eventId: it.eventId, revision: it.revision }; state.confirmDelete = false; state.message = null; state.formError = null;
      state.form = { eventId: it.eventId, eventDate: it.eventDate, title: it.title, receivedJpy: String(it.receivedJpy), refundedJpy: String(it.refundedJpy), paidCount: it.paidCount === '' ? '' : String(it.paidCount), directCostJpy: it.directCostJpy === '' ? '' : String(it.directCostJpy) };
      emit();
    }
    function cancelEdit() { resetForm(); state.message = null; emit(); }
    function buildInput() {
      var f = state.form;
      var rec = toInt(f.receivedJpy), ref = toInt(f.refundedJpy), cnt = toInt(f.paidCount), cost = toInt(f.directCostJpy);
      if (!String(f.eventDate).trim()) return { error: '開催日を入力してください。' };
      if (!String(f.title).trim()) return { error: 'イベント名を入力してください（参加者の情報は入れないでください）。' };
      if (rec === '' || rec !== rec) return { error: '受領総額は0以上の整数円で入力してください。' };
      if (ref === '' || ref !== ref || ref > rec) return { error: '返金済総額は0以上の整数円で、受領総額以下にしてください（返金が無ければ0）。' };
      if (cnt !== cnt) return { error: '有料人数は整数で入力してください（任意）。' };
      if (cost !== cost) return { error: '直接経費は整数円で入力してください（任意）。' };
      return { input: { eventId: f.eventId, eventDate: String(f.eventDate).trim(), title: String(f.title).trim(), receivedJpy: rec, refundedJpy: ref, paidCount: cnt, directCostJpy: cost } };
    }
    function save() {
      if (state.saving) return;
      var built = buildInput();
      if (built.error) { state.formError = built.error; emit(); return; }
      state.saving = true; state.formError = null; state.message = null; emit();
      var gen = formGen;
      api.snbcSave({ input: built.input, expectedRevision: state.editing ? state.editing.revision : null }, function (res) {
        state.saving = false;
        if (res && res.ok) {
          if (gen !== formGen) { load(); if (opts.onSaved) opts.onSaved(); emit(); return; } /* 別のフォームに切り替わっていれば触れない */
          state.message = res.replayed ? '保存済みです（同じ内容の再送でした。金額は重ねていません）。' : '保存しました。年商に反映します。';

        } else {
          if (gen !== formGen) { emit(); return; }
          var err = res && res.error ? res.error : { message: UNCONFIRMED };
          state.formError = withHint(err);
          if (err.code === 'CONFLICT') { state.message = null; load(); }
          if (res && res.error && DENIED_CODES.indexOf(res.error.code) !== -1) state.phase = 'denied';

    }
    function askDelete() { if (state.editing) { state.confirmDelete = true; emit(); } }
    function cancelDelete() { state.confirmDelete = false; emit(); }
    function confirmDelete() {
      if (state.saving || !state.editing) return;
      state.saving = true; state.formError = null; emit();

        else { state.confirmDelete = false; state.formError = withHint(res && res.error ? res.error : { message: UNCONFIRMED }); if (res && res.error && res.error.code === 'CONFLICT') load(); emit(); }
      }, function () { state.saving = false; state.confirmDelete = false; state.formError = UNCONFIRMED; emit(); });

  }

  function renderSnbc(state) {

    if (state.phase === 'denied') return head + '<div class="banner err">この操作の権限がありません。</div>';
    var html = head + '<p class="note">開催後に1イベント1回、実際に受領を確認できた金額だけを入力します（DM・メモから転記。参加者名は入力しません）。将来の開催・見込みは入れないでください。</p>';

    if (state.storeReady === false && state.phase !== 'error') return html + '<div class="banner stale">保存先（既存メモ用スプレッドシート）が未設定のため、記録できません。</div><button type="button" class="inline" data-rec="snbc-close">閉じる</button>';
    if (state.skipped > 0) html += '<div class="banner stale">保存先の ' + esc(state.skipped) + ' 行が不正で読み込めていません（年商に含めていません）。</div>';

      field('開催日（開催済みの日。今日を含む過去）', '<input type="date" data-f="eventDate" value="' + esc(f.eventDate) + '"' + (state.today ? ' max="' + esc(state.today) + '"' : '') + '>') +
      field('イベント名（必須・80文字まで）', '<input type="text" data-f="title" maxlength="80" autocomplete="off" value="' + esc(f.title) + '">') +
      field('実受領総額（円）', '<input type="text" inputmode="numeric" data-f="receivedJpy" autocomplete="off" value="' + esc(f.receivedJpy) + '">') +
      field('返金済総額（円。無ければ0）', '<input type="text" inputmode="numeric" data-f="refundedJpy" autocomplete="off" value="' + esc(f.refundedJpy) + '">') +
      field('有料人数（任意。年商には使いません）', '<input type="text" inputmode="numeric" data-f="paidCount" autocomplete="off" value="' + esc(f.paidCount) + '">') +
      field('直接経費（円・任意。年商から引きません）', '<input type="text" inputmode="numeric" data-f="directCostJpy" autocomplete="off" value="' + esc(f.directCostJpy) + '">');
    if (state.formError) html += '<div class="banner err" role="alert">' + esc(state.formError) + '</div>';
    if (state.confirmDelete) {
      html += '<div class="banner stale" role="alert"><strong>この1件を削除しますか？</strong>（年商から外れます）</div><div class="formbtns"><button type="button" data-rec="snbc-delete-yes"' + (state.saving ? ' disabled' : '') + '>削除する</button><button type="button" data-rec="snbc-delete-no">やめる</button></div>';
    } else {
      html += '<div class="formbtns"><button type="submit" id="rec-snbc-submit"' + (state.saving ? ' disabled' : '') + '>' + (state.saving ? '保存中…' : '保存') + '</button>' +
        (editing ? '<button type="button" data-rec="snbc-cancel">訂正をやめる</button>' : '<button type="button" data-rec="snbc-close">閉じる</button>') + '</div>' +

    }).join('') + '</ul><p class="note">行を押すと訂正・削除できます。差引売上＝受領−返金（開催月に計上）。</p>';
    return html;
  }

  /* ===================== 現地払いの受領 ===================== */
  function emptyOnsiteForm() { return { receivedJpy: '', refundedJpy: '0', method: 'cash', receivedOn: '' }; }

  function createOnsiteController(api, onChange, options) {
    var opts = options || {};
    var state = { bookingId: null, ref: null, phase: 'idle', data: null, error: null, form: emptyOnsiteForm(), saving: false, message: null, formError: null, confirmDelete: false };
    var seq = 0;

    }
    function load(keepMessage) {
      var mine = ++seq;
      var id = state.bookingId;
      state.phase = 'loading'; state.error = null; if (!keepMessage) state.message = null; emit();
      api.onsiteGet(id, function (res) {
        if (mine !== seq || id !== state.bookingId) return;
        if (res && res.ok) { state.data = res; state.phase = 'ready'; fillFrom(res.record); }
        else if (res && res.error && DENIED_CODES.indexOf(res.error.code) !== -1) { state.phase = 'denied'; state.error = res.error; }
        else { state.phase = 'error'; state.error = res && res.error ? res.error : { message: '受領記録の取得に失敗しました。' }; }
        emit();
      }, function () {
        if (mine !== seq || id !== state.bookingId) return;
        state.phase = 'error'; state.error = { message: '受領記録の取得に失敗しました（通信エラー）。' }; emit();
      });
    }
    /* 予約詳細（ops-client の state）が変わるたびに呼ぶ。現地払いの予約だけが対象。 */
    function sync(opsState) {
      var d = opsState && opsState.detailPhase === 'ready' ? opsState.detail : null;
      var eligible = d && String(d.paymentMethod || '').trim() !== CARD_METHOD;
      if (!eligible) {
        if (state.bookingId !== null) { seq++; state.bookingId = null; state.ref = null; state.phase = 'idle'; state.data = null; state.message = null; state.formError = null; state.confirmDelete = false; state.saving = false; state.form = emptyOnsiteForm(); }
        return;
      }
      state.ref = { bookingId: d.bookingId, date: d.date, serviceLabel: d.serviceLabel, price: d.effectivePriceAmount, cancelled: d.status === 'CANCELLED' };
      if (state.bookingId !== d.bookingId) { state.saving = false; state.bookingId = d.bookingId; state.data = null; state.message = null; state.formError = null; state.confirmDelete = false; state.form = emptyOnsiteForm(); load(); }
    }
    function setField(k, v) { if (Object.prototype.hasOwnProperty.call(state.form, k)) state.form[k] = v; }
    function save() {
      if (state.saving) return;
      var f = state.form, rec = toInt(f.receivedJpy), ref = toInt(f.refundedJpy);
      var err = null;
      if (rec === '' || rec !== rec) err = '受け取った累計金額は0以上の整数円で入力してください（0円でも、実際に確認した場合は0と入力）。';
      else if (ref === '' || ref !== ref || ref > rec) err = '返金済みの累計金額は0以上の整数円で、受領額以下にしてください（返金が無ければ0）。';
      else if (!String(f.receivedOn).trim()) err = '受領確認日を入力してください。';
      if (err) { state.formError = err; emit(); return; }
      state.saving = true; state.formError = null; state.message = null; emit();
      var rev = state.data && state.data.record ? state.data.record.revision : null;
      var id = state.bookingId; /* 送信時の予約。応答が戻ったときに別の予約を開いていたら、その予約の入力・表示には触れない。 */
      /* 取消済みの予約での保存は、返金結果の再確認（金額が同じでも確認日時を進める）としてサーバーへ明示する。 */
      api.onsiteSave({ input: { bookingId: id, receivedJpy: rec, refundedJpy: ref, method: f.method, receivedOn: String(f.receivedOn).trim() }, expectedRevision: rev, reconfirm: !!(state.ref && state.ref.cancelled) }, function (res) {
        if (id !== state.bookingId) { if (res && res.ok && opts.onSaved) opts.onSaved(); return; }
        state.saving = false;
        if (res && res.ok) { state.message = res.replayed ? '保存済みです（同じ内容の再送でした。金額は重ねていません）。' : '受領を記録しました。利用終了後に年商へ反映します。'; load(true); if (opts.onSaved) opts.onSaved(); }
        else { var e = res && res.error ? res.error : { message: UNCONFIRMED }; state.formError = withHint(e); if (e.code === 'CONFLICT') load(); emit(); }
      }, function () { if (id !== state.bookingId) return; state.saving = false; state.formError = UNCONFIRMED; emit(); });
    }
    function askDelete() { state.confirmDelete = true; emit(); }
    function cancelDelete() { state.confirmDelete = false; emit(); }
    function confirmDelete() {
      if (state.saving || !state.data || !state.data.record) return;
      state.saving = true; state.formError = null; emit();
      var id = state.bookingId;
      api.onsiteDelete({ bookingId: id, expectedRevision: state.data.record.revision }, function (res) {
        if (id !== state.bookingId) { if (res && res.ok && opts.onSaved) opts.onSaved(); return; }
        state.saving = false; state.confirmDelete = false;
        if (res && res.ok) { state.message = '記録を削除しました。'; load(true); if (opts.onSaved) opts.onSaved(); }
        else { state.formError = withHint(res && res.error ? res.error : { message: UNCONFIRMED }); if (res && res.error && res.error.code === 'CONFLICT') load(); emit(); }
      }, function () { if (id !== state.bookingId) return; state.saving = false; state.confirmDelete = false; state.formError = UNCONFIRMED; emit(); });
    }
    return { state: state, sync: sync, load: load, setField: setField, save: save, askDelete: askDelete, cancelDelete: cancelDelete, confirmDelete: confirmDelete };
  }

  function renderOnsite(state) {
    if (state.phase === 'idle' || !state.ref) return '';
    var head = '<h2>現地払いの受領を記録</h2>';
    if (state.phase === 'loading' && !state.data) return head + '<div class="banner loading" role="status">取得中…</div>';
    if (state.phase === 'denied') return head + '<div class="banner err">この操作の権限がありません。</div>';
    if (state.phase === 'error') return head + '<div class="banner err">' + esc(withHint(state.error)) + '<br><button type="button" class="inline" data-rec="onsite-reload">再取得</button></div>';
    var d = state.data, rec = d.record, r = state.ref;
    var html = head + '<dl><dt>予約ID</dt><dd>' + esc(r.bookingId) + '</dd><dt>利用日</dt><dd>' + esc(r.date) + '</dd><dt>ブランド</dt><dd>' + esc(r.serviceLabel) + '</dd>' +
      '<dt>現在の予定料金</dt><dd>' + (r.price === null || r.price === undefined ? '未計算' : esc(yen(r.price))) + '（参考値。実際の受領額として自動確定しません）</dd></dl>';
    if (d.storeReady === false) return html + '<div class="banner stale">保存先（既存メモ用スプレッドシート）が未設定のため、記録できません。</div>';
    if (state.message) html += '<div class="banner ok" role="status">' + esc(state.message) + '</div>';
    if (d.ledgerReceipt) {
      html += '<div class="banner ok" data-ledger="1"><strong>台帳に記録あり</strong>（カード決済済み、または予約台帳に受領額の記録があります）。台帳を正本とするため、ここでの新規記録は不要です（重複計上の防止）。</div>';
      if (rec) html += '<div class="banner stale" role="alert">手入力の受領記録も残っています（受領 ' + esc(yen(rec.receivedJpy)) + '・返金済 ' + esc(yen(rec.refundedJpy)) + '）。台帳と重複するため年商では「要確認」になります。不要なら削除してください。</div>' +
        (state.confirmDelete ? '<div class="formbtns"><button type="button" data-rec="onsite-delete-yes"' + (state.saving ? ' disabled' : '') + '>削除する</button><button type="button" data-rec="onsite-delete-no">やめる</button></div>' : '<button type="button" class="inline" data-rec="onsite-delete">手入力の記録を削除…</button>');
      if (state.formError) html += '<div class="banner err" role="alert">' + esc(state.formError) + '</div>';
      return html;
    }
    html += '<p class="note">実際に受け取ったことを確認できたときだけ記録してください。金額は取引ごとではなく<strong>累計</strong>です。売上への計上は利用終了後（取消後は取消確定月）です。</p>';
    html += rec ? '<div class="banner" data-recorded="1">記録済み: 受領 ' + esc(yen(rec.receivedJpy)) + '・返金済 ' + esc(yen(rec.refundedJpy)) + '・' + esc(rec.methodLabel) + '・確認日 ' + esc(rec.receivedOn) + '</div>'
      : '<div class="banner">まだ記録がありません（未入力。0円という意味ではありません）。</div>';
    var f = state.form;
    html += '<form class="taskform" data-rec-form="onsite" novalidate>' +
      field('受け取った累計金額（円）', '<input type="text" inputmode="numeric" data-f="receivedJpy" autocomplete="off" value="' + esc(f.receivedJpy) + '">') +
      field('完了した返金の累計金額（円。無ければ0）', '<input type="text" inputmode="numeric" data-f="refundedJpy" autocomplete="off" value="' + esc(f.refundedJpy) + '">') +
      field('方法', '<select data-f="method">' + METHOD_OPTIONS.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (f.method === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>') +
      field('受領確認日', '<input type="date" data-f="receivedOn" value="' + esc(f.receivedOn) + '"' + (d.todayJst ? ' max="' + esc(d.todayJst) + '"' : '') + '>');
    if (state.formError) html += '<div class="banner err" role="alert">' + esc(state.formError) + '</div>';
    if (state.confirmDelete) {
      html += '<div class="banner stale" role="alert"><strong>この予約の受領記録を削除しますか？</strong></div><div class="formbtns"><button type="button" data-rec="onsite-delete-yes"' + (state.saving ? ' disabled' : '') + '>削除する</button><button type="button" data-rec="onsite-delete-no">やめる</button></div>';
    } else {
      html += '<div class="formbtns"><button type="submit" id="rec-onsite-submit"' + (state.saving ? ' disabled' : '') + '>' + (state.saving ? '保存中…' : r.cancelled && rec ? '取消後の返金結果を再確認して保存' : rec ? '訂正して保存' : '受領を記録') + '</button>' +
        (rec ? '<button type="button" data-rec="onsite-delete">誤登録として削除…</button>' : '') + '</div>';
    }
    return html + '</form>';
  }

  /* 現地払い欄の差し込み先。ops-client の予約詳細が、現地払いの予約にだけ置く。 */
  var ONSITE_BOX = '<div id="onsite-box"></div>';

  /*
   * DOMへの結線（ブラウザーでのみ呼ぶ）。api は { snbcList, snbcSave, snbcDelete, onsiteGet, onsiteSave, onsiteDelete }。
   * options.onSaved(): 保存・削除に成功したとき（年商を再取得する）。
   */
  function mount(doc, api, options) {
    var opts = options || {};
    function $(id) { return doc.getElementById(id); }
    var snbc = createSnbcController(api, function () { var el = $('snbc-view'); if (el) el.innerHTML = renderSnbc(snbc.state); }, opts);
    var onsite = createOnsiteController(api, function () { var el = $('onsite-box'); if (el) el.innerHTML = renderOnsite(onsite.state); }, opts);
    function delegate(root, getCtl, prefix) {
      root.addEventListener('input', function (e) { var k = e.target && e.target.getAttribute && e.target.getAttribute('data-f'); if (k && root.contains(e.target)) getCtl().setField(k, e.target.value); });
      root.addEventListener('change', function (e) { var k = e.target && e.target.getAttribute && e.target.getAttribute('data-f'); if (k) getCtl().setField(k, e.target.value); });
      root.addEventListener('submit', function (e) { var f = e.target && e.target.getAttribute && e.target.getAttribute('data-rec-form'); if (f === prefix) { e.preventDefault(); getCtl().save(); } });
      root.addEventListener('click', function (e) {
        var node = e.target;
        while (node && node !== root) {
          var act = node.getAttribute && node.getAttribute('data-rec');
          if (act && act.indexOf(prefix + '-') === 0) {
            var c = getCtl(), a = act.slice(prefix.length + 1);
            if (a === 'edit') c.edit(node.getAttribute('data-id'));
            else if (a === 'cancel') c.cancelEdit();
            else if (a === 'close') c.setOpen(false);
            else if (a === 'reload') c.load();
            else if (a === 'delete') c.askDelete();
            else if (a === 'delete-yes') c.confirmDelete();
            else if (a === 'delete-no') c.cancelDelete();
            return;
          }
          node = node.parentNode;
        }
      });
    }
    if ($('snbc-view')) delegate($('snbc-view'), function () { return snbc; }, 'snbc');
    if ($('view')) delegate($('view'), function () { return onsite; }, 'onsite');
    /* 予約タブの変更通知から呼ぶ。詳細が再描画されても入力中の内容は state に残っている。 */
    function syncOnsite(opsState) { onsite.sync(opsState); var el = $('onsite-box'); if (el) el.innerHTML = renderOnsite(onsite.state); }
    return { snbc: snbc, onsite: onsite, toggleSnbc: function () { snbc.toggle(); }, syncOnsite: syncOnsite };
  }

  return { esc: esc, yen: yen, toInt: toInt, createSnbcController: createSnbcController, createOnsiteController: createOnsiteController,
    renderSnbc: renderSnbc, renderOnsite: renderOnsite, mount: mount, ONSITE_BOX: ONSITE_BOX, CARD_METHOD: CARD_METHOD };
});

</script>
  <script>
/*
 * gas-adapter.js — 共通接続契約のGAS実アダプター（Issue #936）。
 *
 * GASのWebアプリ内（HtmlService配信）でだけ使う。google.script.run はここに閉じ込め、画面ロジック
 * （ops-client.js）は契約 { list, detail } だけに依存する。予約は読み取り専用の2関数のみ。
 * メモ（#941）は createGasTasksApi（一覧・保存・削除の3関数。保存先は専用スプレッドシートに固定）。
 * 失敗ハンドラは通信失敗を「取得に失敗」として扱う（0件・正常にはしない）。応答の中身は検証せず
 * バックエンドの応答をそのまま渡す（権限判定はサーバー側）。
 */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.OpsGasAdapter = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* runner は google.script.run 相当（テストでは差し替える）。 */
  function createGasApi(runner) {
    function call(name, arg, ok, ng) {
      try {
        runner.withSuccessHandler(ok).withFailureHandler(ng)[name](arg);
      } catch (e) {
        ng(e);
      }
    }
    return {
      kind: 'gas',
      list: function (params, ok, ng) { call('opsListReservations', params, ok, ng); },
      detail: function (id, ok, ng) { call('opsGetReservation', id, ok, ng); },
      /* 鍵・案内の状況（#942）。読み取り専用。接続先・トークンは画面に渡らない。 */
      keyStatus: function (id, ok, ng) { call('opsGetKeyStatus', id, ok, ng); },
      /* 年商・月次の売上集計（#990 PR-B）。読み取り専用。 */
      revenue: function (params, ok, ng) { call('opsGetRevenue', params, ok, ng); },
      /* 運営枠の閲覧（#1003）。読み取り専用。読取先Calendarは引数で渡さない（サーバー側の設定に固定）。 */
      internalSlots: function (ok, ng) { call('opsListInternalSlots', {}, ok, ng); }
    };
  }

  /*
   * メモ（Issue #941）用のGASアダプター。保存・削除は端末の項目と版番号だけを渡し、保存先のID・範囲・
   * 権限は一切渡さない（サーバーが毎回、所有者認可して専用の保存先に固定して書く）。
   * 通信失敗は ng として通知する。成功か失敗かの判断（保存を確認できたか）は応答の ok だけに基づく。
   */
  function createGasTasksApi(runner) {
    function call(name, arg, ok, ng) {
      try {
        runner.withSuccessHandler(ok).withFailureHandler(ng)[name](arg);
      } catch (e) {
        ng(e);
      }
    }
    return {
      kind: 'gas',
      list: function (ok, ng) { call('opsListTasks', {}, ok, ng); },
      save: function (payload, ok, ng) { call('opsSaveTask', payload, ok, ng); },
      remove: function (payload, ok, ng) { call('opsDeleteTask', payload, ok, ng); }
    };
  }

  /*
   * SNBC売上・現地払い受領（Issue #995）用のGASアダプター。端末の項目と版番号だけを渡し、保存先のID・タブ名・範囲は一切渡さない
   * （サーバーが毎回、所有者認可して既存メモ保存先内の固定2タブに限って読み書きする）。
   */
  function createGasRecordsApi(runner) {
    function call(name, arg, ok, ng) {
      try {
        runner.withSuccessHandler(ok).withFailureHandler(ng)[name](arg);
      } catch (e) {
        ng(e);
      }
    }
    return {
      kind: 'gas',
      snbcList: function (ok, ng) { call('opsListSnbc', {}, ok, ng); },
      snbcSave: function (payload, ok, ng) { call('opsSaveSnbc', payload, ok, ng); },
      snbcDelete: function (payload, ok, ng) { call('opsDeleteSnbc', payload, ok, ng); },
      onsiteGet: function (bookingId, ok, ng) { call('opsGetOnsite', bookingId, ok, ng); },
      onsiteSave: function (payload, ok, ng) { call('opsSaveOnsite', payload, ok, ng); },
      onsiteDelete: function (payload, ok, ng) { call('opsDeleteOnsite', payload, ok, ng); }
    };
  }

  return { createGasApi: createGasApi, createGasTasksApi: createGasTasksApi, createGasRecordsApi: createGasRecordsApi };
});

</script>

    (function () {
      var range = OpsHomeClient.monthRange(OpsHomeClient.jstMonth(Date.now()));
      var home = null;
      var rec = null, revCtl = null;

        { initial: { service: 'all', status: 'active', scope: 'custom', from: range.from, to: range.to }, onChange: function (s) { if (home) home.render(); if (rec) rec.syncOnsite(s); } });
      var tasksCtl = OpsTasksClient.mount(document, OpsGasAdapter.createGasTasksApi(google.script.run), { onChange: function () { if (home) home.render(); } });
      rec = OpsRecordsClient.mount(document, OpsGasAdapter.createGasRecordsApi(google.script.run), { onSaved: function () { if (revCtl) revCtl.load(); } });
      revCtl = OpsRevenueClient.mount(document, OpsGasAdapter.createGasApi(google.script.run), { onDrill: function (d) { home.drill(d.month); }, onSnbc: function () { rec.toggleSnbc(); } });
