<!DOCTYPE html>
<!--
  BookingAdminPage.html — 個人用Booking Admin Web UI（Issue #305）。
  1ページのみ。詳細はモーダルで表示する（別ページを増やさない）。
  データ取得・確定・キャンセルはすべてgoogle.script.run経由でBookingAdminWeb.gsを呼ぶ。
  クライアント側でstatusを推測・書き換えることはしない（操作後は必ずサーバーから再取得する）。

  Issue #317で薄いローダーへ変更した。CSS/JavaScriptの実体はこのファイルには置かず、
  GitHub Pages（admin/booking/booking-admin.css・admin/booking/booking-admin.js）から
  配信する。このファイルが変更するのは、そのCSS/JSを読み込むための末尾のローダー
  <script>のみで、DOM構造（header/tabs/sort-select/main/list/modal-overlay等の
  id/class名）とgoogle.script.runが使えるHtmlServiceの実行コンテキストは維持する。
  表示文言・カードUI・ソートUI等の通常のフロントエンド変更は、GitHub Pages側の
  admin/booking/配下の更新のみで反映でき、GAS Web Appの再デプロイは不要
  （このファイル自体・google.script.run APIを変更しない限り。詳細はgas/booking/README.md
  「Booking Adminフロントエンドの外部化（Issue #317）」参照）。
-->
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
</head>
<body>
  <header>
    <h1>Booking Admin</h1>
    <div class="tabs">
      <button type="button" class="tab-button active" data-filter="today">今日</button>
      <button type="button" class="tab-button" data-filter="upcoming">今後</button>
      <button type="button" class="tab-button" data-filter="cancelled">キャンセル</button>
      <button type="button" class="tab-button" data-filter="all">すべて</button>
    </div>
    <div class="sort-row">
      <label class="sort-label" for="sort-select">並び順</label>
      <select id="sort-select">
        <option value="date">日付順</option>
        <option value="reservation">予約順</option>
      </select>
    </div>
  </header>

  <main>
    <div id="status-line"></div>
    <div id="list"></div>
  </main>

  <div id="modal-overlay">
    <div id="modal">
      <h2>予約詳細</h2>
      <dl id="modal-body"></dl>
      <button type="button" id="modal-close">閉じる</button>
    </div>
  </div>

  <script>
    /*
     * ローダー本体（Issue #317）。外部CSS/JSのURLは絶対URL固定（GAS HtmlServiceは
     * Jekyllのビルド対象外のため、相対パス・{{ site.baseurl }}は使えない）。
     * 古いCSS/JSがブラウザ・GAS側にキャッシュされて長時間残らないよう、
     * <link>/<script>タグをこのインラインJSが実行時に動的生成し、srcへ
     * リクエストごとに変わるクエリ文字列（?t=Date.now()）を付与してからDOMへ
     * 挿入する（固定の<link href="...">/<script src="...">をHTMLに直書きしない）。
     * この方式により、キャッシュ回避の値を変えるためだけにBookingAdminPage.html
     * 自体を毎回変更する必要がない。
     */
    (function () {
      var BASE_URL = 'https://nagoya-base.github.io/Studio-nagoya-base/admin/booking/';
      var cacheBuster = '?t=' + Date.now();

      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = BASE_URL + 'booking-admin.css' + cacheBuster;
      document.head.appendChild(link);

      var script = document.createElement('script');
      script.src = BASE_URL + 'booking-admin.js' + cacheBuster;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
