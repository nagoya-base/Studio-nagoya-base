name: SwitchBot queryDetails diagnostic (manual)

# Issue #739: queryWebhook(queryDetails) を 1 回だけ読み取り専用で確認する診断。queryUrl(#737)との比較で 190 の発生範囲を切り分ける。
# POST /v1.1/webhook/queryWebhook（action=queryDetails）のみ。setup / update / delete 等の変更 API は実行しない。手動実行専用。
# 公式仕様上 queryDetails は照会対象 URL（urls 配列）が必須のため、URL の元になる Secret を渡す（値は出力しない）。
# SWITCHBOT_DEVICE_ID は不要。既存 webhook-query / webhook-raw の挙動は変更しない。
on:
  workflow_dispatch:
    inputs:
      target:
        description: '照会対象 URL（current=今回のリレーURL / old=VERIFY_OLD_WEBHOOK_URL）'
        required: true
        type: choice
        default: current
        options:
          - current
          - old

permissions:
  contents: read

concurrency:
  group: switchbot-verify-webhook-details
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: switchbot-verify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: queryDetails の応答構造を確認（読み取り専用・URL値と応答全文は出力しない）
        env:
          TARGET: ${{ inputs.target }}
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          VERIFY_RELAY_URL: ${{ secrets.VERIFY_RELAY_URL }}
          VERIFY_WEBHOOK_TOKEN: ${{ secrets.VERIFY_WEBHOOK_TOKEN }}
          VERIFY_OLD_WEBHOOK_URL: ${{ secrets.VERIFY_OLD_WEBHOOK_URL }}
        run: node scripts/switchbot-verify-webhook-details.js
