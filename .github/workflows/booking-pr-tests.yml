name: PR booking tests

on:
  push:
    branches:
      - claude/nagoya-booking-price-calc-7ck27i
  pull_request:
    paths:
      - 'gas/booking/**'
      - 'scripts/booking-*.js'
      - 'scripts/prepare-booking-gas-project.js'
      - 'scripts/classify-clasp-push-error.js'
      - 'admin/booking/**'
      - 'gas/survey/**'
      - 'survey/**'
      - 'scripts/survey-*.js'
      - 'scripts/prepare-survey-gas-project.js'
      - '_includes/booking_app_*.html'
      - 'test/**'
      - 'cloud-run/**'
      - '.github/workflows/booking-pr-tests.yml'
      - '.github/workflows/booking-gas-production.yml'
      - '.github/workflows/booking-gas-webhook-production.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install stripe-webhook-relay dependencies
        run: npm ci
        working-directory: cloud-run/stripe-webhook-relay
      - name: Run repository tests
        run: npm test
