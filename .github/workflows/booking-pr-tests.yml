name: PR booking tests

# PR CI（秘密・Environment・外部APIなし）。Issue #804 PR-B:
#  - workflow単独の変更でも漏れなく走るよう、個別列挙をやめて `.github/workflows/**` を監視する。
#  - 古い単発branch（claude/nagoya-booking-price-calc-7ck27i）へのpush triggerを廃止した
#    （そのbranchはリモートに存在せず、push由来の実行は2026-09-25の2件のみ。PRのpull_requestで同じ検査が走る）。
on:
  pull_request:
    paths:
      - 'gas/booking/**'
      - 'scripts/booking-*.js'
      - 'scripts/prepare-booking-gas-project.js'
      - 'scripts/classify-clasp-push-error.js'
      - 'scripts/classify-clasp-list-error.js'
      - 'scripts/deploy-booking-gas-target.sh'
      - 'scripts/run-booking-tests-isolated.sh'
      - 'scripts/booking-test-isolation-probe.sh'
      - 'admin/booking/**'
      - 'gas/survey/**'
      - 'gas/switchbot-verify/**'
      - 'gas/switchbot-access/**'
      - 'scripts/switchbot-*.js'
      - 'scripts/prepare-switchbot-access-gas-project.js'
      - 'scripts/deploy-switchbot-verify-gas.sh'
      - 'scripts/deploy-switchbot-access-gas.sh'
      - 'scripts/deploy-switchbot-access-test-gas.sh'
      - 'survey/**'
      - 'scripts/survey-*.js'
      - 'scripts/prepare-survey-gas-project.js'
      - 'gas/feedback/**'
      - 'gas/feedback-admin/**'
      - 'scripts/prepare-feedback-admin-gas-project.js'
      - 'feedback/**'
      - 'scripts/feedback-*.js'
      - 'scripts/prepare-feedback-gas-project.js'
      - 'styles/feedback.css'
      - '_includes/booking_app_*.html'
      - 'test/**'
      - 'cloud-run/**'
      - 'scripts/confirm-booking-production-account.js'
      - 'scripts/preflight-gas-project.sh'
      - 'scripts/verify-gas-deployment-sha.sh'
      - 'scripts/gas-deployment-list-lib.sh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install stripe-webhook-relay dependencies
        run: npm ci
        working-directory: cloud-run/stripe-webhook-relay
      - name: Run repository tests
        run: npm test

  # Issue #874（PR #875 レビュー）: Booking GAS本番workflowが承認後に使うテスト隔離（run-booking-tests-isolated.sh）が
  # 実際に成立することを、Secretsなしで検証する。probeは「悪意あるテスト／依存コード」の操作を模す。
  booking-test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # 隔離の前後でホストのアカウント・cron/at設定ファイルが完全に一致することを確かめるための記録（存在しない場合も記録）。
      - name: Record host account and cron/at files before the isolated runs
        run: |
          set -euo pipefail
          for f in /etc/passwd /etc/group /etc/shadow /etc/gshadow /etc/subuid /etc/subgid /etc/cron.deny /etc/at.deny /etc/cron.allow /etc/at.allow; do
            if sudo test -e "$f"; then sudo sha256sum "$f"; else echo "absent $f"; fi
          done > "$RUNNER_TEMP/host-state-before.txt"
          cat "$RUNNER_TEMP/host-state-before.txt"
      # runner上の /usr/local/bin・hostedtoolcache は world-writable。canaryと既存world-writableファイルでその状況を模す。
      - name: Probe - forbidden operations (incl. world-writable host paths) are refused and leftovers are removed
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/booking-isolation-canary
          sudo chmod 1777 /srv/booking-isolation-canary
          BOOKING_ISOLATION_CANARY=/srv/booking-isolation-canary \
            bash scripts/run-booking-tests-isolated.sh probe scripts/booking-test-isolation-probe.sh
          if [[ -n "$(sudo find /srv/booking-isolation-canary -mindepth 1 -print -quit)" ]]; then echo "the canary was written" >&2; exit 1; fi
          if pgrep -f 'sleep 600[78]' >/dev/null; then echo "a background process of the isolated user survived" >&2; exit 1; fi
          for f in /tmp/booking-isolation-leftover /dev/shm/booking-isolation-leftover; do
            if [[ -e "$f" ]]; then echo "leftover file remains: $f" >&2; exit 1; fi
          done
          if getent passwd | grep -q '^booking-test-'; then echo "the isolated user remains" >&2; exit 1; fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all --ignored)"
          sudo rm -rf /srv/booking-isolation-canary
      # 隔離の外（root）から、隔離ユーザー所有のファイルと常駐プロセスを注入し、後片付けの検証が exit 3 で止めることを確かめる。
      - name: Teardown check - an injected leftover outside the allowed areas stops with ISOLATION_NOT_CONFIRMED (exit 3)
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/booking-isolation-inject
          (
            for i in $(seq 1 600); do
              u="$(getent passwd | awk -F: '/^booking-test-/{print $1; exit}')"
              if [[ -n "$u" ]]; then
                sudo install -o "$u" /dev/null /srv/booking-isolation-inject/escape
                sudo -u "$u" setsid sleep 6009 </dev/null >/dev/null 2>&1 &
                break
              fi
              sleep 0.1
            done
          ) &
          status=0
          bash scripts/run-booking-tests-isolated.sh probe scripts/booking-test-isolation-probe.sh 2>"$RUNNER_TEMP/isolation-stderr.txt" || status=$?
          wait
          cat "$RUNNER_TEMP/isolation-stderr.txt" >&2
          test "$status" -eq 3
          grep -q ISOLATION_NOT_CONFIRMED "$RUNNER_TEMP/isolation-stderr.txt"
          grep -q /srv/booking-isolation-inject/escape "$RUNNER_TEMP/isolation-stderr.txt"
          if pgrep -f 'sleep 6009' >/dev/null; then echo "the injected process survived" >&2; exit 1; fi
          rm -f "$RUNNER_TEMP/isolation-stderr.txt"
          sudo rm -rf /srv/booking-isolation-inject
      # 後片付けの走査・削除・再走査が失敗した場合（sudoを包むラッパーで該当コマンドだけを失敗させる）に、
      # 握りつぶさず exit 3 で止まり、隔離ユーザー自体は削除されることを確かめる。
      - name: Teardown check - scan, cleanup and re-scan failures fail closed (exit 3)
        run: |
          set -euo pipefail
          fake="$RUNNER_TEMP/fake-sudo"
          mkdir -p "$fake"
          real_sudo="$(command -v sudo)"
          printf '%s\n' '#!/bin/bash' \
            'if [[ -n "${BOOKING_FAKE_SUDO_FAIL:-}" && "$*" =~ $BOOKING_FAKE_SUDO_FAIL ]]; then echo "injected failure" >&2; exit 2; fi' \
            "exec $real_sudo \"\$@\"" > "$fake/sudo"
          chmod 755 "$fake/sudo"
          check() { # <pattern> <expected code>
            local status=0
            PATH="$fake:$PATH" BOOKING_FAKE_SUDO_FAIL="$1" \
              bash scripts/run-booking-tests-isolated.sh probe scripts/booking-test-isolation-probe.sh 2>"$RUNNER_TEMP/isolation-stderr.txt" || status=$?
            cat "$RUNNER_TEMP/isolation-stderr.txt" >&2
            test "$status" -eq 3
            grep -q ISOLATION_NOT_CONFIRMED "$RUNNER_TEMP/isolation-stderr.txt"
            grep -q "$2" "$RUNNER_TEMP/isolation-stderr.txt"
            if getent passwd | grep -q '^booking-test-'; then echo "the isolated user remains" >&2; exit 1; fi
          }
          check '^-n find / ' 'SCAN_FAILED: the filesystem scan'
          check '^-n find /tmp /var/tmp /dev/shm ' 'SCAN_FAILED: the re-scan of the shared temp areas'
          check '^-n find /var/tmp -xdev -depth' 'SHARED_TEMP_CLEANUP_FAILED'
          rm -rf "$fake" "$RUNNER_TEMP/isolation-stderr.txt"
      - name: Host account and cron/at files are unchanged after the probe runs
        run: |
          set -euo pipefail
          for f in /etc/passwd /etc/group /etc/shadow /etc/gshadow /etc/subuid /etc/subgid /etc/cron.deny /etc/at.deny /etc/cron.allow /etc/at.allow; do
            if sudo test -e "$f"; then sudo sha256sum "$f"; else echo "absent $f"; fi
          done > "$RUNNER_TEMP/host-state-after.txt"
          diff "$RUNNER_TEMP/host-state-before.txt" "$RUNNER_TEMP/host-state-after.txt"
      - name: Repository tests pass as the isolated user (same command as the production workflow)
        run: |
          set -euo pipefail
          bash scripts/run-booking-tests-isolated.sh repository-tests
          for f in /etc/passwd /etc/group /etc/shadow /etc/gshadow /etc/subuid /etc/subgid /etc/cron.deny /etc/at.deny /etc/cron.allow /etc/at.allow; do
            if sudo test -e "$f"; then sudo sha256sum "$f"; else echo "absent $f"; fi
          done | diff "$RUNNER_TEMP/host-state-before.txt" -
