name: Deploy Booking GAS to production

# 正規の本番反映手順（gas/booking/README.md）。
#   scope=full（既定）: 1回のEnvironment承認で Booking Admin → Booking Web App → post-check を同一job内で直列実行。
#   scope=admin-only  : Booking Adminだけを更新して停止（Publicは更新しない）。Bookings schema変更時・初回bootstrap用。
# Bookings schema migrationはこのworkflowでは行わない。管理者がBooking AdminのApps Scriptエディタで
# `migrateBookingsSchema` を実行する（Sheets API・サービスアカウント鍵・WIF/OIDCは使わない）。
# schema変更時は admin-only → migrateBookingsSchema実行 → full(schema_migrated=true) の二段階。
# いずれかが失敗した時点で後続は実行しない。
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full: Admin -> Public -> post-check / admin-only: Booking Adminだけ更新して停止（schema変更時・初回bootstrap用）'
        type: choice
        options:
          - full
          - admin-only
        default: full
      schema_migrated:
        description: 'Apps ScriptエディタでmigrateBookingsSchema を実行し成功を確認済み（BookingsSchema.gsに差分があるfullでは必須）'
        type: boolean
        default: false

permissions:
  contents: read

# Booking GAS本番全体で1つ（Admin/Publicやrun同士の同時実行を防ぐ）。
concurrency:
  group: booking-gas-production
  cancel-in-progress: false

jobs:
  test:
    name: Test main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Ruby and Jekyll (Gemfile.lock)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install stripe-webhook-relay dependencies
        run: npm ci
        working-directory: cloud-run/stripe-webhook-relay
      - name: Run repository tests
        run: npm test

  deploy:
    name: Update existing Admin and Public deployments
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: booking-production
    steps:
      - name: Check out the approved main commit (full history for the schema diff guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1
      # 各stepには必要なSecretだけを渡す（clasp installのstepにはSecretを渡さない）。
      - name: Validate scope
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE" != "full" && "$SCOPE" != "admin-only" ]]; then
            echo "scope must be full or admin-only." >&2
            exit 1
          fi
      # Environment承認の後・Admin更新の前に実行する（clasp認証はEnvironment secretsにある）。
      # 基準SHAはBooking Web App（Public）のDeploymentからのみ取得する（Adminは基準にしない）。
      - name: Schema diff guard (Booking Web App previous production commit)
        if: inputs.scope == 'full'
        env:
          PUBLIC_CLASPRC_JSON: ${{ secrets.BOOKING_PUBLIC_CLASPRC_JSON }}
          PUBLIC_SCRIPT_ID: ${{ secrets.BOOKING_PUBLIC_SCRIPT_ID }}
          PUBLIC_DEPLOYMENT_ID: ${{ secrets.BOOKING_PUBLIC_DEPLOYMENT_ID }}
          SCHEMA_MIGRATED: ${{ inputs.schema_migrated }}
        run: bash scripts/deploy-booking-gas-target.sh public schema-guard
      - name: Update the existing Booking Admin deployment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          ADMIN_SCRIPT_ID: ${{ secrets.BOOKING_ADMIN_SCRIPT_ID }}
          ADMIN_DEPLOYMENT_ID: ${{ secrets.BOOKING_ADMIN_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if ! bash scripts/deploy-booking-gas-target.sh admin; then
            if [[ -f "$RUNNER_TEMP/booking-gas-admin-update-applied" ]]; then
              echo "Booking Admin deployment update was applied but its verification failed; the Booking Web App was not started. Check the Admin deployment state." >&2
            else
              echo "Booking Admin update did not complete; the Booking Web App was not started. Check the Admin deployment state before re-running." >&2
            fi
            exit 1
          fi
      - name: Update the existing Booking Web App deployment
        if: inputs.scope == 'full'
        env:
          PUBLIC_CLASPRC_JSON: ${{ secrets.BOOKING_PUBLIC_CLASPRC_JSON }}
          PUBLIC_SCRIPT_ID: ${{ secrets.BOOKING_PUBLIC_SCRIPT_ID }}
          PUBLIC_DEPLOYMENT_ID: ${{ secrets.BOOKING_PUBLIC_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if ! bash scripts/deploy-booking-gas-target.sh public; then
            if [[ -f "$RUNNER_TEMP/booking-gas-public-update-applied" ]]; then
              echo "Booking Admin is updated to the current main commit. The Booking Web App deployment update was applied but its verification failed; check the Web App deployment state." >&2
            else
              echo "Booking Admin is updated to the current main commit. The Booking Web App update did not complete; the Web App deployment state must be checked before re-running." >&2
            fi
            exit 1
          fi
      - name: Post-deploy check (Booking Admin deployment)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          ADMIN_SCRIPT_ID: ${{ secrets.BOOKING_ADMIN_SCRIPT_ID }}
          ADMIN_DEPLOYMENT_ID: ${{ secrets.BOOKING_ADMIN_DEPLOYMENT_ID }}
        run: bash scripts/deploy-booking-gas-target.sh admin verify
      - name: Post-deploy check (Booking Web App deployment)
        if: inputs.scope == 'full'
        env:
          PUBLIC_CLASPRC_JSON: ${{ secrets.BOOKING_PUBLIC_CLASPRC_JSON }}
          PUBLIC_SCRIPT_ID: ${{ secrets.BOOKING_PUBLIC_SCRIPT_ID }}
          PUBLIC_DEPLOYMENT_ID: ${{ secrets.BOOKING_PUBLIC_DEPLOYMENT_ID }}
        run: bash scripts/deploy-booking-gas-target.sh public verify
      - name: Next step after admin-only
        if: inputs.scope == 'admin-only'
        run: echo "Booking Admin was updated; the Booking Web App deployment was left unchanged. Run migrateBookingsSchema in the Booking Admin Apps Script editor, then run this workflow with scope=full and schema_migrated=true."
