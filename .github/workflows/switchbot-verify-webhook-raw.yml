name: SwitchBot queryWebhook raw diagnostic (manual)

# Issue #737: queryWebhook(queryUrl) の応答構造を 1 回だけ読み取り専用で確認する診断。
# POST /v1.1/webhook/queryWebhook（action=queryUrl）のみ。setup / update / delete 等の変更 API は実行しない。手動実行専用。
# SWITCHBOT_DEVICE_ID は不要（Webhook 照会は deviceId に依存しない）。既存 webhook-query の判定ロジックとは独立。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: switchbot-verify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: queryWebhook の応答構造を確認（読み取り専用・URL値と応答全文は出力しない）
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
        run: node scripts/switchbot-verify-webhook-raw.js
