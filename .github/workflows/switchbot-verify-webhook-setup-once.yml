name: SwitchBot setup-current-once (manual, one-shot)

# Issue #741: statusCode=190 状態で現行 Webhook URL に setupWebhook を「1回だけ」送り、復旧可否を観測する例外的な検証。
# 変更系 API: setupWebhook のみ（1回）。deleteWebhook / updateWebhook / createKey / deleteKey / Keypad 変更は呼ばない。
# Re-run jobs（run_attempt>1）では送信しない。自動リトライなし。URL は Secrets から実行時に組み立て、入力・ログに出さない。
# 手動実行専用。確認文字列 I-CONFIRM-SETUP-CURRENT-ONCE が必須。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '確認文字列（I-CONFIRM-SETUP-CURRENT-ONCE）'
        required: true
        type: string

permissions:
  contents: read

# 他の Webhook 変更 Action（switchbot-verify-key）と同じ group で直列化し、同時実行しない。
concurrency:
  group: switchbot-verify-key
  cancel-in-progress: false

jobs:
  setup-once:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: switchbot-verify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: setupWebhook を 1 回だけ送信し、読み取り専用で復旧可否を確認（URL・応答全文は出力しない）
        env:
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          VERIFY_RELAY_URL: ${{ secrets.VERIFY_RELAY_URL }}
          VERIFY_WEBHOOK_TOKEN: ${{ secrets.VERIFY_WEBHOOK_TOKEN }}
        run: node scripts/switchbot-verify-webhook-setup-once.js
