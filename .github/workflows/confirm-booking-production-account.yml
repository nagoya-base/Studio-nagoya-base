name: Confirm booking-production Google account

# Issue #804 PR-A: 公開Actionsログへ個人情報（Googleアカウントのメール等）を出さない。
# 既定clasp資格情報（Booking Admin用 `default` user）のアカウントが、非公開Environment secret
# BOOKING_EXPECTED_GOOGLE_ACCOUNT と一致するかだけを確認し、固定コード（ACCOUNT_MATCH 等）のみを表示する。
# 手動実行・booking-production承認・既存scopeのまま。Secrets/Environmentの設定変更は行わない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-account:
    runs-on: ubuntu-latest
    environment: booking-production
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm the default credential account (fixed result only)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          BOOKING_EXPECTED_GOOGLE_ACCOUNT: ${{ secrets.BOOKING_EXPECTED_GOOGLE_ACCOUNT }}
        run: node scripts/confirm-booking-production-account.js
