name: SwitchBot device ID check (manual)

# Issue #720: 登録済み Environment Secret SWITCHBOT_DEVICE_ID の読み取り専用確認。
# GET /v1.1/devices のみ。createKey / deleteKey / Webhook は実行しない。手動実行専用。
on:
  workflow_dispatch:
    inputs:
      last4:
        description: '対象 Keypad の末尾4桁（アプリ等で確認済みの値）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: switchbot-verify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 登録値の完全ID一致を確認（末尾4桁のみ表示）
        env:
          KEYPAD_LAST4: ${{ inputs.last4 }}
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          SWITCHBOT_DEVICE_ID: ${{ secrets.SWITCHBOT_DEVICE_ID }}
        run: node scripts/switchbot-verify-device-id.js
