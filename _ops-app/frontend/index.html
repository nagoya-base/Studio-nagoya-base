<!DOCTYPE html>
<!--
  予約確認・メモ（フロントエンド・モック表示）— Issue #936 / #941。
  ★ すべて架空のモックデータです。実バックエンドには接続しません。実際の予約は表示されません。
  画面ロジックは ops-client.js（通信方式に依存しない）、データはモックアダプターから受け取ります。
  Sites 等での本番運用は、共通接続契約を満たす実アダプターと認証付き接続を採用した後に別途結合します。
  ?scenario=ok|empty|error|diag_api_disabled|not_connected|denied|flaky で予約モックの、?key=ok|not_connected|failed|denied で鍵状態モックの、
  ?tasks=ok|empty|not_ready|save_error|conflict|denied でメモ（#941）モックの状態を切り替えて確認できます。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>予約確認・メモ（モック）</title>
  <style>
    :root { --bg:#f4f6fb; --fg:#14213d; --muted:#5b6478; --line:#d5dbe8; --card:#fff; --warn:#9a5b00; --err:#b3261e; --navy:#14284b; --blue:#1d5bd8; --blue-soft:#e8effd; --on-accent:#fff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1626; --fg:#e8ecf6; --muted:#9aa5bd; --line:#2a3550; --card:#18223a; --warn:#f2b24c; --err:#f2877f; --navy:#0b1220; --blue:#6f9cf5; --blue-soft:#1d2c52; --on-accent:#0b1220; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    header { background:var(--bg); border-bottom:1px solid var(--line); }
    header, main { padding: 12px max(16px, calc((100% - 928px) / 2)); }
    main { padding-bottom: 48px; }
    h1 { font-size: 1.15rem; margin: 4px 0 8px; color:var(--navy); }
    @media (prefers-color-scheme: dark) { h1 { color:var(--fg); } }
    .note { color: var(--muted); font-size: .85rem; margin: 0 0 8px; }
    .filters { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filters label { display:block; font-size:.8rem; color:var(--muted); min-width:0; }
    .filters select, .filters input, button { width:100%; min-height:44px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 8px; min-width:0; }
    button { cursor:pointer; }
    button:hover { border-color:var(--blue); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--blue); outline-offset:1px; }
    button:disabled { opacity:.5; cursor:default; }
    #f-reload, #t-new, #t-submit { background:var(--blue); color:var(--on-accent); border-color:var(--blue); font-weight:700; }
    .row2 { grid-column: 1 / -1; display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    .banner { margin:10px 0; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); font-size:.9rem; overflow-wrap:anywhere; }
    .banner.err { border-color: var(--err); color: var(--err); }
    .banner .diag { margin-top:6px; color:var(--fg); font-size:.85rem; }
    .banner .diag code { font-weight:600; }
    .banner.stale { border-color: var(--warn); color: var(--warn); }
    .cards { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
    .card { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(20,40,75,.06); }
    button.card { position:relative; padding-right:36px; }
    button.card::after { content:"›"; position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:1.6rem; color:var(--blue); }
    button.card:hover, button.card:active { border-color:var(--blue); background:var(--blue-soft); }
    .card .more { color:var(--blue); font-size:.85rem; font-weight:600; margin-top:4px; }
    .tag.st-CONFIRMED { background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600; }
    .tag.st-PENDING { border-color:var(--warn); color:var(--warn); font-weight:600; }
    .tag.st-CANCELLED, .tag.st-EXPIRED, .tag.st-UNKNOWN { color:var(--muted); }
    .taskhead { display:block; width:100%; text-align:left; border:0; background:none; padding:0; min-height:44px; position:relative; padding-right:28px; }
    .taskhead::after { content:"▾"; position:absolute; right:4px; top:4px; color:var(--blue); }
    .taskhead[aria-expanded="true"]::after { content:"▴"; }
    .loading { color:var(--muted); }
    .banner.err::before { content:"⚠ "; }
    .card .top { display:flex; gap:8px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); }
    .card .when { font-weight:600; font-size:1.05rem; margin:4px 0; }
    .tag { display:inline-block; padding:0 8px; border:1px solid var(--line); border-radius:999px; font-size:.78rem; }
    dl { display:grid; grid-template-columns: 8.5em 1fr; gap:6px 10px; margin:0; }
    dt { color:var(--muted); font-size:.85rem; } dd { margin:0; overflow-wrap:anywhere; }
    .empty { color:var(--muted); font-style:italic; }
    details { margin-top:12px; } details li { overflow-wrap:anywhere; }
    .tabs { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin:8px 0; }
    .tabs button { font-weight:600; }
    .tabs button[aria-selected="true"] { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; }
    [hidden] { display:none !important; }
    .banner.ok { border-color:#2e7d32; color:#2e7d32; }
    @media (prefers-color-scheme: dark) { .banner.ok { border-color:#81c995; color:#81c995; } }
    .tag.danger { border-color: var(--err); color: var(--err); font-weight:600; }
    h2 { font-size:1rem; margin:16px 0 8px; }
    .summary { margin:8px 0; display:flex; gap:8px; flex-wrap:wrap; }
    .memo { white-space:pre-wrap; margin:4px 0; }
    .task.overdue { border-color: var(--err); }
    .actions { display:grid; grid-template-columns: repeat(auto-fit, minmax(7em, 1fr)); gap:8px; margin-top:8px; }
    form.taskform { display:grid; gap:8px; margin:10px 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
    form.taskform label { display:block; font-size:.8rem; color:var(--muted); min-width:0; }
    form.taskform input, form.taskform select, form.taskform textarea { width:100%; min-height:44px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; min-width:0; }
    form.taskform textarea { min-height:6em; }
    .formbtns { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    @media (min-width: 900px) { header { position:sticky; top:0; z-index:5; } .cards { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 640px) { .filters { grid-template-columns: repeat(4, 1fr); } .row2 { grid-column: auto; grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <!--OPS:HEAD-->
    <h1>予約確認・メモ（モック）</h1>
    <p class="note">架空のモックデータです。実際の予約・メモは表示も保存もされません。</p>
    <!--/OPS:HEAD-->
    <nav class="tabs" aria-label="表示の切り替え">
      <button type="button" id="tab-res" aria-selected="true">予約</button>
      <button type="button" id="tab-tasks" aria-selected="false">メモ・期限</button>
    </nav>
    <div class="filters" id="res-filters">
      <label>サービス<select id="f-service"></select></label>
      <label>状態<select id="f-status"></select></label>
      <label>期間<select id="f-scope"><option value="upcoming">今日から30日間</option><option value="past">過去30日間</option><option value="custom">日付を指定</option></select></label>
      <div class="row2"><button type="button" id="f-reload">再取得</button></div>
      <label>開始日<input type="date" id="f-from"></label>
      <label>終了日<input type="date" id="f-to"></label>
    </div>
  </header>
  <main>
    <div id="res-panel">
      <div id="banner"></div>
      <div id="view"></div>
    </div>
    <section id="tasks-panel" hidden aria-label="未対応メモと期限">
      <div id="tasks-banner"></div>
      <div id="tasks-summary"></div>
      <p class="note">件名とリンクだけを登録してください。お客様の氏名・連絡先・DM本文は書かないでください。</p>
      <button type="button" id="t-new">＋ メモを追加</button>
      <form id="t-form" class="taskform" hidden novalidate>
        <strong id="t-form-title">メモを追加</strong>
        <label>件名（必須・80文字まで）<input type="text" id="t-title" maxlength="80" autocomplete="off"></label>
        <label>状態<select id="t-status"></select></label>
        <label>期限（任意）<input type="date" id="t-due"></label>
        <label>サービス（任意）<select id="t-service"></select></label>
        <label>予約ID（任意）<input type="text" id="t-booking" maxlength="64" autocomplete="off" inputmode="latin"></label>
        <label>短いメモ（500文字まで）<textarea id="t-memo" maxlength="500"></textarea></label>
        <label>証跡リンク（任意・https:// のみ）<input type="url" id="t-url" maxlength="300" autocomplete="off" inputmode="url"></label>
        <div class="formbtns"><button type="submit" id="t-submit">保存</button><button type="button" id="t-cancel">キャンセル</button></div>
      </form>
      <div id="tasks-view"></div>
    </section>
  </main>
  <!--OPS:SCRIPTS-->
  <script src="ops-client.js"></script>
  <script src="tasks-client.js"></script>
  <script src="mock-adapter.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      OpsClient.mount(document, OpsMockAdapter.createMockApi({ scenario: q.get('scenario') || 'ok', key: q.get('key') || 'ok' }));
      OpsTasksClient.mount(document, OpsMockAdapter.createMockTasksApi({ scenario: q.get('tasks') || 'ok' }));
    })();
  </script>
  <!--/OPS:SCRIPTS-->
</body>
</html>
