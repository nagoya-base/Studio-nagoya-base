# お知らせデータ（3ページ共通）
# 新しいお知らせは先頭に追加する
- date: "2026.11.15"
  type: "重要"
  body: "【改定のお知らせ】プライバシーポリシーの保管・削除に関する項目を2026年11月15日に改定しました（告知日：2026年11月1日）。予約・会員等の台帳に記録した氏名・メールアドレス等の個人情報は、利用終了・取消確定・退会後の資格終了等、情報ごとに定める起算日時から180日が経過した後、対象条件を満たしたものを日次処理で消去します。有効な会員情報、将来の予約、未精算・返金・紛争等の対応中の情報、起算日時や紐付けを確認できない記録は対象から除外します。取引の照合・会計等に必要な限定記録は別に保持します。台帳の版の履歴、メール、カレンダー、Stripe等の外部サービスに残る情報は、この消去の対象に含まれません。"
- date: "2026.11.01"
  type: "重要"
  body: "【改定版掲載】Studio X利用規約 第13条（予約時の同意）の改定版を2026年11月1日に掲載しました。施行日は2026年11月12日です（2026年10月28日告知済み）。予約申込みの際に予約確認画面で利用規約・キャンセルポリシー・プライバシーポリシーへの同意を確認のうえ送信した時点で同意したものとし、3つの規定の関係を明確にしています。11月12日より前の申込みには従前の規定を適用します。料金・キャンセル条件そのものの変更はありません。"
- date: "2026.11.01"
  type: "重要"
  body: "【規約表記の整備・改定のお知らせ】SNB・SNB mens・Studio Xの利用規約等について、現行の予約・会員・利用ルールに合わせた表記整備の改定版を2026年11月1日に掲載しました。施行日は2026年11月16日です（告知日：2026年11月1日）。支払方法別の予約成立条件、通常部屋料金と会員資格の区別、ペアパックの自動適用、Studio Xの旧料金と有料機材・スタッフ対応の開始条件、英語版の飲食・吊り・会員条件、貸切ベースプランとmensシャワーパックの例外を明確にします。一部の表記は10月29日付の修正で訂正しています。今回その内容を改めて告知し、改定履歴を明確にします。料金・キャンセル条件・提供内容を追加変更するものではありません。Studio X第13条の11月12日改定と、プライバシーポリシーの11月15日改定は別の告知です。詳しくは各ブランドの規約ページをご確認ください。"
- date: "2026.11.01"
  type: "重要"
  body: "【改定予告】プライバシーポリシーの保管・削除に関する項目を2026年11月15日に改定します（告知日：2026年11月1日）。予約・会員等の台帳に記録した氏名・メールアドレス等の個人情報は、利用終了・取消確定・退会後の資格終了等、情報ごとに定める起算日時から180日が経過した後、対象条件を満たしたものを日次処理で消去する内容を明記します。有効な会員情報、将来の予約、未精算・返金・紛争等の対応中の情報、起算日時や紐付けを確認できない記録は対象から除外します。取引の照合・会計等に必要な限定記録は別に保持します。台帳の版の履歴、メール、カレンダー、Stripe等の外部サービスに残る情報は、この処理の消去対象に含まれません。自動消去は効力発生日以降、準備が整い次第、順次開始します。本日時点のプライバシーポリシー本文は変更していません。"
- date: "2026.10.28"
  type: "重要"
  body: "【改定予告】Studio X利用規約 第13条（予約時の同意）を2026年11月12日に改定します（告知日：2026年10月28日）。現行の「予約・撮影相談フォームでの申込み」という記載を、現在の予約手続きに合わせ、予約申込みの際に予約確認画面で利用規約・キャンセルポリシー・プライバシーポリシーへの同意を確認のうえ送信した時点で同意したものとする内容に改めます。あわせて、3つの規定の関係を明確にします。料金・キャンセル条件そのものの変更はありません。本日時点の規約本文は変更していません。"
