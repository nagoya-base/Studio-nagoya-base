# お知らせデータ（3ページ共通）
# 新しいお知らせは先頭に追加する
- date: "2026.11.04"
  type: "重要"
  body: "【予約開始時刻のお知らせ】告知日：2026年11月4日／施行日：2026年11月19日 0:00（日本時間）。選びやすくするため、SNB・SNB mens・Studio Xの全ブランド共通で、予約の開始時刻の候補を毎時00分・30分にします（例：10:00、10:30、11:00）。利用時間は従来どおり1時間単位で、料金・延長の単位・プラン固有の条件は変わりません。同日施行の「予約ルール改定のお知らせ」（予約間30分・当日延長）に加えて、開始時刻の候補もこの日から変わります。施行日の前日までは従前の開始候補（15分刻み）です。施行日前に確定した15分・45分開始の予約はそのまま有効で、自動で変更・取消しすることはありません（開始時刻を変えずに終了時刻を延ばす延長も、従前どおり扱います）。"
- date: "2026.11.04"
  type: "重要"
  body: "【予約ルール改定のお知らせ】告知日：2026年11月4日／施行日：2026年11月19日 0:00（日本時間）。SNB・SNB mens・Studio Xの全ブランド共通で、①予約と予約の間に30分の間隔を設けます（施行日以降に行う新規予約・日時変更・失効した予約の復活の空き判定に適用。これにより予約できる枠が減る場合があります）。②利用当日に開始時刻を変えず終了時刻だけを延ばす延長について、終了時刻の60分前を過ぎると、延長できない場合があります。施行日の前までは従前の条件が適用され、施行日前に確定した予約を自動で移動・取消しすることはありません。Studio Xの6時間貸切ベースプランの途中延長不可など個別の条件、料金、キャンセル条件に変更はありません。11月16日施行の規約表記の整備とは別の告知です。"
- date: "2026.11.01"
  type: "重要"
  body: "【改定版掲載】プライバシーポリシーの保管・削除に関する改定版を2026年11月1日に掲載しました。施行日は2026年11月15日です（告知日：2026年11月1日）。11月14日までは従前の規定を適用します。以下の台帳の消去に関する追加規定は11月15日から適用します。予約・会員等の台帳に記録した氏名・メールアドレス等の個人情報は、利用終了・取消確定・退会後の資格終了等、情報ごとに定める起算日時から180日が経過した後、対象条件を満たしたものを日次処理で消去します。有効な会員情報、将来の予約、未精算・返金・紛争等の対応中の情報、起算日時や紐付けを確認できない記録は対象から除外します。取引の照合・会計等に必要な限定記録は別に保持します。台帳の版の履歴、メール、カレンダー、Stripe等の外部サービスに残る情報は、この消去の対象に含まれません。なお、効力発生日は自動消去の開始日ではありません。日次処理は、準備が整い開始条件を満たした後に開始します。"
- date: "2026.11.01"
  type: "重要"
  body: "【改定版掲載】Studio X利用規約 第13条（予約時の同意）の改定版を2026年11月1日に掲載しました。施行日は2026年11月12日です（2026年10月28日告知済み）。予約申込みの際に予約確認画面で利用規約・キャンセルポリシー・プライバシーポリシーへの同意を確認のうえ送信した時点で同意したものとし、3つの規定の関係を明確にしています。11月12日より前の申込みには従前の規定を適用します。料金・キャンセル条件そのものの変更はありません。"
- date: "2026.11.01"
  type: "重要"
  body: "【規約表記の整備・改定のお知らせ】SNB・SNB mens・Studio Xの利用規約等について、現行の予約・会員・利用ルールに合わせた表記整備の改定版を2026年11月1日に掲載しました。施行日は2026年11月16日です（告知日：2026年11月1日）。支払方法別の予約成立条件、通常部屋料金と会員資格の区別、ペアパックの自動適用、Studio Xの旧料金と有料機材・スタッフ対応の開始条件、英語版の飲食・吊り・会員条件、貸切ベースプランとmensシャワーパックの例外を明確にします。一部の表記は10月29日付の修正で訂正しています。今回その内容を改めて告知し、改定履歴を明確にします。料金・キャンセル条件・提供内容を追加変更するものではありません。Studio X第13条の11月12日改定と、プライバシーポリシーの11月15日改定は別の告知です。詳しくは各ブランドの規約ページをご確認ください。"
- date: "2026.11.01"
  type: "重要"
  body: "【改定予告】プライバシーポリシーの保管・削除に関する項目を2026年11月15日に改定します（告知日：2026年11月1日）。予約・会員等の台帳に記録した氏名・メールアドレス等の個人情報は、利用終了・取消確定・退会後の資格終了等、情報ごとに定める起算日時から180日が経過した後、対象条件を満たしたものを日次処理で消去する内容を明記します。有効な会員情報、将来の予約、未精算・返金・紛争等の対応中の情報、起算日時や紐付けを確認できない記録は対象から除外します。取引の照合・会計等に必要な限定記録は別に保持します。台帳の版の履歴、メール、カレンダー、Stripe等の外部サービスに残る情報は、この処理の消去対象に含まれません。自動消去は効力発生日以降、準備が整い次第、順次開始します。本日時点のプライバシーポリシー本文は変更していません。"
- date: "2026.10.28"
  type: "重要"
  body: "【改定予告】Studio X利用規約 第13条（予約時の同意）を2026年11月12日に改定します（告知日：2026年10月28日）。現行の「予約・撮影相談フォームでの申込み」という記載を、現在の予約手続きに合わせ、予約申込みの際に予約確認画面で利用規約・キャンセルポリシー・プライバシーポリシーへの同意を確認のうえ送信した時点で同意したものとする内容に改めます。あわせて、3つの規定の関係を明確にします。料金・キャンセル条件そのものの変更はありません。本日時点の規約本文は変更していません。"
