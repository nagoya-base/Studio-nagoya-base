  body: "予約方法を更新しました。新しい予約ページでは、利用日・利用時間を指定し、予約できる開始時刻を選んでそのまま仮予約をお申し込みいただけます。予約前のご相談は、これまでどおり相談フォームをご利用いただけます。"
