# Studio X「一室で、6つの世界。」の背景・テーマ案内（/studio-x/equipment/ の予約オプション検討用）。
# 名称・並び・画像はStudio Xトップ（studio-x/index.html #worlds）に合わせる。
# 料金・在庫・スタッフ対応可否の正本は _data/studio_x_equipment.json。ここには金額を持たない。
#   width / height: 画像の実寸。元の縦横比で表示するため img に出力する（トップ studio-x/index.html の --ratio と同値）。
#   column / position: PCで3列に並べたときの列（高さが揃うよう割当）と、1列表示での並び順（kickerの番号と同じ）。
#   staff_theme   : staffService.themes の code。一致すれば「スタッフ設営を依頼できる」と表示する。空の場合は staff_via で補足する。
#   related_codes : rental / freeSelf の code（表示名は正本から引く）。
